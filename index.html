<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fishing Map</title>
<meta name="theme-color" content="#0b2a4a">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
:root{--teal:#2fd3a5;--blue:#1e8fe0;--navy:#0b2a4a;--orange:#f26a1b;--ink:#17202a;--grey:#6b7785}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#0b1a12}
#map{position:fixed;inset:0;background:#1b2a1f}
button{font:inherit;cursor:pointer;border:0}
/* glow on depth panes */
.leaflet-bands-pane{filter:drop-shadow(0 0 3px rgba(159,243,232,.95)) drop-shadow(0 0 9px rgba(94,200,216,.55))}
.leaflet-fallback-pane{filter:drop-shadow(0 0 3px rgba(159,243,232,.8)) drop-shadow(0 0 8px rgba(94,200,216,.4))}
/* search */
#top{position:fixed;z-index:1000;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;max-width:560px;margin:0 auto}
#sbox{flex:1;position:relative}
#search{width:100%;height:46px;border-radius:23px;border:0;padding:0 16px 0 42px;font-size:16px;background:rgba(255,255,255,.96);box-shadow:0 4px 16px rgba(0,0,0,.25);outline:none;color:var(--ink)}
#sbox svg{position:absolute;left:14px;top:13px;opacity:.55}
#results{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
#results div{padding:11px 16px;border-bottom:1px solid #eef1f4;font-size:14px}
#results div:active,#results div:hover{background:#f2f7fb}
.rbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.96);box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.rbtn.off{opacity:.65}
#locate{position:fixed;z-index:1000;right:14px;bottom:calc(106px + env(safe-area-inset-bottom))}
#add{position:fixed;z-index:1000;right:12px;bottom:calc(30px + env(safe-area-inset-bottom));width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;font-size:36px;line-height:1;box-shadow:0 6px 18px rgba(30,143,224,.55),0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
body.card-open #add,body.card-open #locate,body.sheet-open #add,body.sheet-open #locate{display:none}
/* legend */
#legend{position:fixed;z-index:999;left:12px;bottom:calc(34px + env(safe-area-inset-bottom));background:rgba(11,42,74,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:10px;padding:6px 7px;font-size:10px;display:none}
#legend .r{display:flex;align-items:center;gap:5px;height:13px}
#legend i{width:12px;height:9px;border-radius:2px;display:inline-block}
body.card-open #legend{display:none!important}
/* attribution */
.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.45)!important;color:#dfe8ee;max-width:68vw;border-radius:6px 0 0 0;max-height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.leaflet-control-attribution.full{max-height:none;white-space:normal}
.leaflet-control-attribution a{color:#bfe6ff}
/* pins */
.pinw{position:relative;width:30px;height:40px}
.pinw .shadow{position:absolute;left:8px;bottom:-3px;width:14px;height:5px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(1px)}
.pinw svg{position:absolute;left:0;top:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.newpill{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--orange);color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.newpill:after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--orange)}
.pin-sel svg{transform:scale(1.18);transform-origin:50% 100%}
.launch{width:20px;height:20px;border-radius:50%;background:rgba(11,42,74,.78);border:1.5px solid rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center}
.clus{position:relative;width:44px;height:44px}
.clus .b{width:44px;height:44px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.clus .n{position:absolute;right:-8px;top:-5px;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:var(--navy);color:#fff;border:2px solid #fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.clus .newpill{bottom:52px}
.marker-cluster{background:none}.marker-cluster div{background:none}
/* bottom card */
#card{position:fixed;z-index:1100;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;overflow:hidden;transform:translateY(130%);transition:transform .28s cubic-bezier(.2,.8,.2,1);min-height:150px}
body.card-open #card{transform:none}
#card .ph{position:relative;width:44%;min-height:150px;flex:none;background:#123f66 center/cover no-repeat;overflow:hidden;border-radius:14px;margin:6px}
#card .ribbon{position:absolute;left:-30px;top:12px;width:110px;transform:rotate(-45deg);background:var(--orange);color:#fff;text-align:center;font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 0;box-shadow:0 2px 4px rgba(0,0,0,.25)}
#card .body{flex:1;padding:12px 12px 10px 8px;display:flex;flex-direction:column;min-width:0}
#card .hd{display:flex;align-items:center;gap:8px;padding-right:22px}
#card .av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:var(--blue)}
#card .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .sub{color:var(--grey);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .note{margin:9px 0 6px;font-size:15px;line-height:1.3;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#card .stats{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--ink);font-weight:600;flex-wrap:wrap}
#card .stats span{display:flex;align-items:center;gap:5px}
#card .stats a{color:var(--blue);text-decoration:none;display:flex;align-items:center;gap:4px}
#card .x{position:absolute;right:8px;top:8px;width:26px;height:26px;border-radius:50%;background:#eef2f5;color:#556;font-size:15px;display:flex;align-items:center;justify-content:center}
#card .del{background:none;color:#c0392b;font-size:12px;padding:0;font-weight:600}
/* sheet (log a catch) */
#sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);padding:10px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto}
body.sheet-open #sheet{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d5dbe0;margin:0 auto 10px}
#sheet h3{margin:0 0 10px;font-size:18px}
#photoBox{height:150px;border-radius:14px;background:#eef3f7 center/cover no-repeat;display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
#photoBox.has .pbtn{background:rgba(255,255,255,.9)}
.pbtn{background:#fff;color:var(--ink);border-radius:20px;padding:8px 14px;font-size:14px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f label{display:block;font-size:11px;color:var(--grey);font-weight:600;margin:0 0 3px 2px;text-transform:uppercase;letter-spacing:.04em}
.f input,.f textarea{width:100%;border:1px solid #dde3e8;border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;background:#f9fbfc;color:var(--ink)}
.f.full{grid-column:1/-1}
#locLine{font-size:12px;color:var(--grey);margin:10px 2px;display:flex;justify-content:space-between;gap:8px;align-items:center}
#locLine button{background:none;color:var(--blue);font-weight:600;font-size:12px;padding:0}
.acts{display:flex;gap:10px;margin-top:8px}
.acts button{flex:1;height:46px;border-radius:23px;font-weight:700;font-size:16px}
#save{background:var(--blue);color:#fff}#cancel{background:#eef2f5;color:var(--ink)}
#cross{position:fixed;z-index:1001;left:50%;top:50%;width:30px;height:40px;margin:-40px 0 0 -15px;display:none;pointer-events:none}
body.picking #cross{display:block}
#toast{position:fixed;z-index:1300;left:50%;top:calc(66px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(11,42,74,.92);color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;display:none;max-width:90vw;text-align:center}
</style>
</head>
<body>
<div id="map"></div>

<div id="top">
  <div id="sbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search" type="search" placeholder="Search lakes, rivers, places" autocomplete="off" enterkeyhint="search">
    <div id="results"></div>
  </div>
  <button class="rbtn" id="depthBtn" aria-label="Toggle depth" title="Depth on/off">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e8fe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="#9ff3e8" stroke="#2a8fb5"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5" stroke="#123f66"/></svg>
  </button>
</div>

<button class="rbtn" id="locate" aria-label="Locate me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e8fe0" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#1e8fe0"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
<button id="add" aria-label="Log a catch">+</button>
<div id="legend"></div>
<div id="cross"><svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 39C15 39 2 23.5 2 14.5A13 13 0 0 1 28 14.5C28 23.5 15 39 15 39Z" fill="#f26a1b" stroke="#fff" stroke-width="2.5"/><circle cx="15" cy="14.5" r="4.5" fill="#fff"/></svg></div>

<div id="card"></div>

<div id="sheet">
  <div class="grab"></div>
  <h3>Log a catch</h3>
  <div id="photoBox">
    <button class="pbtn" id="takePhoto">📷 Take photo</button>
    <button class="pbtn" id="pickPhoto">🖼 Upload</button>
  </div>
  <input type="file" id="camIn" accept="image/*" capture="environment" hidden>
  <input type="file" id="fileIn" accept="image/*" hidden>
  <div class="grid">
    <div class="f full"><label>Species</label><input id="c_species" list="species" placeholder="e.g. Rainbow trout"></div>
    <div class="f"><label>Weight (lb)</label><input id="c_weight" inputmode="decimal" placeholder="2.5"></div>
    <div class="f"><label>Length (in)</label><input id="c_length" inputmode="decimal" placeholder="16"></div>
    <div class="f"><label>Lure / bait</label><input id="c_lure" placeholder="Drop shot"></div>
    <div class="f"><label>Depth (ft)</label><input id="c_depth" inputmode="decimal" placeholder="18"></div>
    <div class="f full"><label>Note</label><textarea id="c_note" rows="2" placeholder="How was it?"></textarea></div>
  </div>
  <div id="locLine"><span id="locText">Location: map center</span><button id="locSwap">Use my GPS</button></div>
  <div class="acts"><button id="cancel">Cancel</button><button id="save">Save catch</button></div>
  <datalist id="species"><option>Rainbow trout</option><option>Cutthroat trout</option><option>Brown trout</option><option>Brook trout</option><option>Kokanee</option><option>Chinook salmon</option><option>Coho salmon</option><option>Pink salmon</option><option>Steelhead</option><option>Largemouth bass</option><option>Smallmouth bass</option><option>Yellow perch</option><option>Walleye</option><option>Black crappie</option><option>Bluegill</option><option>Northern pikeminnow</option><option>Lingcod</option><option>Rockfish</option><option>Halibut</option><option>Dungeness crab</option></datalist>
</div>
<div id="toast"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms);}
async function getJSON(url,opt={},ms=25000){const c=new AbortController();const h=setTimeout(()=>c.abort(),ms);try{const r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);return await r.json();}finally{clearTimeout(h);}}
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<86400*30)return Math.floor(s/86400)+'d';if(s<86400*365)return Math.floor(s/86400/30)+'mo';return Math.floor(s/86400/365)+'y';}

// ---------- palette ----------
const STOPS=[[0,'#9ff3e8'],[8,'#5ec8d8'],[18,'#2a8fb5'],[30,'#1b5f8c'],[45,'#123f66'],[70,'#0b2a4a']];
function hex(h){return[1,3,5].map(i=>parseInt(h.substr(i,2),16));}
function depthColor(ft){if(ft<=0)return STOPS[0][1];for(let i=1;i<STOPS.length;i++){if(ft<=STOPS[i][0]){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];const t=(ft-a)/(b-a),x=hex(ca),y=hex(cb);return'rgb('+x.map((v,j)=>Math.round(v+(y[j]-v)*t)).join(',')+')';}}return STOPS[STOPS.length-1][1];}

// ---------- map ----------
const sv=JSON.parse(localStorage.getItem('fm2.view')||'null');
const map=L.map('map',{zoomControl:false,attributionControl:true,worldCopyJump:true,tap:true}).setView(sv?[sv.lat,sv.lng]:[47.605,-122.06],sv?sv.z:12);
map.on('moveend',()=>{const c=map.getCenter();localStorage.setItem('fm2.view',JSON.stringify({lat:c.lat,lng:c.lng,z:map.getZoom()}));});
map.attributionControl.setPrefix(false);
map.attributionControl.getContainer().addEventListener('click',e=>{if(e.target.tagName!=='A')e.currentTarget.classList.toggle('full');});
map.attributionControl.addAttribution('⚠ Not for navigation');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagery © <a href="https://www.esri.com">Esri</a>, Maxar, Earthstar'}).addTo(map);
map.createPane('fallback').style.zIndex=330;
map.createPane('bands').style.zIndex=340;
const bandRenderer=L.svg({pane:'bands',padding:0.5});

// NOAA NCEI elevation model colored into depth steps server-side (fallback where no lake polygons)
const ArcExport=L.TileLayer.extend({
  initialize(u,o){this._u=u;L.TileLayer.prototype.initialize.call(this,u,o);},
  getTileUrl(c){const s=this.getTileSize();const nw=L.CRS.EPSG3857.project(this._map.unproject([c.x*s.x,c.y*s.y],c.z)),se=L.CRS.EPSG3857.project(this._map.unproject([(c.x+1)*s.x,(c.y+1)*s.y],c.z));
    return `${this._u}/exportImage?bbox=${nw.x},${se.y},${se.x},${nw.y}&bboxSR=3857&imageSR=3857&size=${s.x},${s.y}&format=png32&transparent=true&interpolation=RSP_BilinearInterpolation&renderingRule=${this.options.rule}&f=image`;}
});
const M_STEPS=[[2,-1.5],[-1.5,-3],[-3,-6],[-6,-9],[-9,-14],[-14,-21],[-21,-40],[-40,-12000]]; // metres
const ftMid=[0,7,15,25,37,55,90,150];
const rule=encodeURIComponent(JSON.stringify({rasterFunction:'Colormap',rasterFunctionArguments:{
  Colormap:ftMid.map((f,i)=>[i+1,...(depthColor(f).startsWith('#')?hex(depthColor(f)):depthColor(f).match(/\d+/g).map(Number))]),
  Raster:{rasterFunction:'Remap',rasterFunctionArguments:{InputRanges:M_STEPS.flatMap(([a,b])=>[b,a]),OutputValues:M_STEPS.map((_,i)=>i+1),NoDataRanges:[2,9000],AllowUnmatched:false}}}}));
const fallback=new ArcExport('https://gis.ngdc.noaa.gov/arcgis/rest/services/DEM_mosaics/DEM_global_mosaic/ImageServer',{rule,pane:'fallback',opacity:.82,maxZoom:19,maxNativeZoom:16,attribution:'Depth: <a href="https://www.ncei.noaa.gov">NOAA NCEI</a>'});

// ---------- WA lake depth bands (Ecology polygons) ----------
const WA=L.latLngBounds([45.5,-124.9],[49.1,-116.8]);
const BAND_URLS=['https://gis.ecology.wa.gov/serverext/rest/services/Authoritative/ECY/MapServer/4','https://gis.ecology.wa.gov/serverext/rest/services/GIS/Lakes/MapServer/9'];
const bandGroup=L.layerGroup();
const bands=new Map(); // id -> {lvl, layer, d}
const cellsDone=new Set();
let depthOn=localStorage.getItem('fm2.depth')!=='0';
function lvlFor(z){return z<=12?0:z<=14?1:2;}
const CELL=[0.16,0.06,0.025], TOL=[12,4,1.2]; // degrees cell size, metres simplification
function bandDepth(p){const lo=+p.LO_DEPTH_QT_FT||0,hi=+p.HI_DEPTH_QT_FT||0;return(hi===0&&lo>5)?lo+2:Math.min(lo,hi);}
let bandBusy=0;
async function loadBands(){
  if(!depthOn||map.getZoom()<11||!map.getBounds().intersects(WA))return;
  const z=map.getZoom(),lvl=lvlFor(z),cs=CELL[lvl],b=map.getBounds();
  const jobs=[];
  for(let x=Math.floor(b.getWest()/cs);x<=Math.floor(b.getEast()/cs);x++)for(let y=Math.floor(b.getSouth()/cs);y<=Math.floor(b.getNorth()/cs);y++){const k=lvl+':'+x+':'+y;if(!cellsDone.has(k)){cellsDone.add(k);jobs.push([x*cs,y*cs,(x+1)*cs,(y+1)*cs,k]);}}
  if(!jobs.length)return;
  bandBusy++;
  await Promise.all(jobs.map(async([w,s,e,n,k])=>{
    const q=`/query?where=1%3D1&geometry=${w},${s},${e},${n}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=OBJECTID,LO_DEPTH_QT_FT,HI_DEPTH_QT_FT&outSR=4326&maxAllowableOffset=${(TOL[lvl]/111000).toFixed(7)}&geometryPrecision=6&f=geojson`;
    let gj=null;for(const u of BAND_URLS){try{gj=await getJSON(u+q,{},30000);if(gj.features)break;}catch(err){gj=null;}}
    if(!gj){cellsDone.delete(k);return;}
    for(const f of gj.features||[]){const id=f.id??f.properties.OBJECTID;const old=bands.get(id);if(old&&old.lvl>=lvl)continue;
      const d=bandDepth(f.properties),col=depthColor(d);
      const layer=L.geoJSON(f,{renderer:bandRenderer,pane:'bands',interactive:false,smoothFactor:.6,style:{fillColor:col,fillOpacity:.9,color:col,weight:.8,opacity:.9}});
      if(old)bandGroup.removeLayer(old.layer);bands.set(id,{lvl,layer,d});bandGroup.addLayer(layer);}
  }));
  [...bands.values()].sort((a,b)=>a.d-b.d).forEach(v=>v.layer.bringToFront());
  bandBusy--;
}
function applyDepth(){
  $('#depthBtn').classList.toggle('off',!depthOn);
  if(depthOn){fallback.addTo(map);bandGroup.addTo(map);loadBands();}else{map.removeLayer(fallback);map.removeLayer(bandGroup);}
  updLegend();
}
$('#depthBtn').onclick=()=>{depthOn=!depthOn;localStorage.setItem('fm2.depth',depthOn?'1':'0');applyDepth();toast(depthOn?'Depth on':'Plain satellite');};
const LEG=[0,10,20,30,45,60];
$('#legend').innerHTML=LEG.map((f,i)=>`<div class="r"><i style="background:${depthColor(f)}"></i>${f}${i===LEG.length-1?'+':''} ft</div>`).join('');
function updLegend(){$('#legend').style.display=(depthOn&&map.getZoom()>=13)?'block':'none';}

// ---------- pins ----------
function pinSVG(inner){return `<svg width="30" height="40" viewBox="0 0 30 40"><path d="M15 39C15 39 2 23.5 2 14.5A13 13 0 0 1 28 14.5C28 23.5 15 39 15 39Z" fill="#2fd3a5" stroke="#fff" stroke-width="2.5"/>${inner}</svg>`;}
const DOT='<circle cx="15" cy="14.5" r="4.6" fill="#fff"/>';
const FISHG='<path d="M7.5 14.5c2.6-3.4 7.4-4 11-1.2l3.4-2.4v7.2l-3.4-2.4c-3.6 2.8-8.4 2.2-11-1.2z" fill="#fff"/><circle cx="11" cy="13.9" r=".9" fill="#2fd3a5"/>';
function pinIcon(isNew,inner,big){return L.divIcon({className:'',iconSize:[30,40],iconAnchor:[15,39],html:`<div class="pinw">${isNew?`<div class="newpill"${big?' style="font-size:13px;padding:5px 11px"':''}>NEW</div>`:''}<div class="shadow"></div>${pinSVG(inner)}</div>`});}

// ---------- catches (IndexedDB) ----------
let db;
function idb(){return db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('fishmap',1);r.onupgradeneeded=()=>r.result.createObjectStore('catches',{keyPath:'id'});r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>rej(r.error);});}
async function dbAll(){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction('catches').objectStore('catches').getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbPut(o){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('catches','readwrite');t.objectStore('catches').put(o);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
async function dbDel(id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction('catches','readwrite');t.objectStore('catches').delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}
const catchMarkers=new Map();
function addCatchMarker(c){const isNew=Date.now()-c.ts<3*864e5;const m=L.marker([c.lat,c.lng],{icon:pinIcon(isNew,DOT),isNew,keyboard:false});m.on('click',()=>openCatch(c,m));clusters.addLayer(m);catchMarkers.set(c.id,m);return m;}
async function loadCatches(){try{(await dbAll()).forEach(addCatchMarker);}catch(e){console.warn('IndexedDB unavailable',e);}}

// ---------- WDFW stocking ----------
const WDFW='https://geodataservices.wdfw.wa.gov/arcgis/rest/services/ApplicationServices/FishWA_2014_AllLakes_PROD/MapServer';
const AB={LTL:'LITTLE',UPR:'UPPER',LWR:'LOWER',N:'NORTH',S:'SOUTH',E:'EAST',W:'WEST',MT:'MOUNT',ST:'SAINT'};
const DROP=new Set(['LK','LKS','LAKE','LAKES','POND','PONDS','PD','RES','RESERVOIR','THE']);
const nkey=n=>String(n||'').toUpperCase().replace(/\bT\d+\b/g,'').replace(/[^A-Z0-9 ]/g,' ').split(/\s+/).filter(Boolean).map(w=>AB[w]||w).filter(w=>!DROP.has(w)&&!/^\d+$/.test(w)).sort().join(' ');
const pretty=s=>String(s).replace(/\s*\([^)]*\)/g,'').replace(/\s+T\d+$/,'').replace(/\bLKS\b/g,'Lakes').replace(/\bLK\b/g,'Lake').replace(/\bRES\b/g,'Reservoir').replace(/\bPD\b/g,'Pond').replace(/\bLTL\b/g,'Little').replace(/\bUPR\b/g,'Upper').replace(/\bLWR\b/g,'Lower').toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase()).trim();
let stockLoaded=false;
async function loadStocking(){
  if(stockLoaded||!map.getBounds().intersects(WA)||map.getZoom()<7)return;stockLoaded=true;
  try{
    const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
    const [rows,a,b]=await Promise.all([
      getJSON(`https://data.wa.gov/resource/6fex-3r7d.json?$where=${encodeURIComponent(`release_start_date >= '${since}'`)}&$order=release_start_date%20DESC&$limit=3000&$select=release_location,county,species,number_released,number_of_fish_per_pound,release_start_date,lifestage`,{},40000),
      getJSON(`${WDFW}/2/query?where=1%3D1&outFields=LakeName,CountyName&outSR=4326&f=geojson`,{},40000),
      getJSON(`${WDFW}/24/query?where=1%3D1&outFields=*&outSR=4326&f=geojson`,{},40000).catch(()=>({features:[]}))]);
    const idx=new Map();
    for(const f of a.features||[]){const p=f.properties;idx.set(nkey(p.LakeName)+'|'+String(p.CountyName||'').slice(0,4).toUpperCase(),{c:f.geometry.coordinates,name:p.LakeName});}
    for(const f of b.features||[]){const p={};for(const k in f.properties)p[k.split('.').pop()]=f.properties[k];const k=nkey(p.LakeMapName)+'|'+String(p.CountyName||'').slice(0,4).toUpperCase();if(!idx.has(k))idx.set(k,{c:f.geometry.coordinates,name:p.LakeMapName+' Lake'});}
    const groups=new Map();
    for(const r of rows){const m=r.release_location.match(/^(.*?)\s*\(([A-Z]{4})[^)]*\)/);if(!m)continue;const hit=idx.get(nkey(m[1])+'|'+m[2]);if(!hit)continue;
      const g=groups.get(r.release_location)||{name:hit.name||pretty(r.release_location),county:(r.county||'').trim(),lat:hit.c[1],lng:hit.c[0],plants:[]};g.plants.push(r);groups.set(r.release_location,g);}
    for(const g of groups.values()){g.ts=Date.parse(g.plants[0].release_start_date);g.total=g.plants.reduce((s,p)=>s+(+p.number_released||0),0);g.species=[...new Set(g.plants.map(p=>p.species))];
      const isNew=Date.now()-g.ts<14*864e5;const m=L.marker([g.lat,g.lng],{icon:pinIcon(isNew,FISHG),isNew,keyboard:false});m.on('click',()=>openStock(g,m));clusters.addLayer(m);}
  }catch(e){stockLoaded=false;console.warn('stocking',e);}
}

// ---------- boat launches (subtle) ----------
const LAUNCH_ICON=L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],html:'<div class="launch"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l3 5h12l3-5z"/><path d="M12 15V4l6 8h-6"/></svg></div>'});
const launchSeen=new Map();let launchCells=new Set();
async function loadLaunches(){
  if(map.getZoom()<12){map.removeLayer(launches);return;}
  if(!map.hasLayer(launches))launches.addTo(map);
  const b=map.getBounds(),cs=0.1;
  for(let x=Math.floor(b.getWest()/cs);x<=Math.floor(b.getEast()/cs);x++)for(let y=Math.floor(b.getSouth()/cs);y<=Math.floor(b.getNorth()/cs);y++){
    const k=x+':'+y;if(launchCells.has(k))continue;launchCells.add(k);
    const w=x*cs,s=y*cs,e=w+cs,n=s+cs,inWA=WA.intersects(L.latLngBounds([s,w],[n,e]));
    (inWA?getJSON(`${WDFW}/0/query?where=1%3D1&geometry=${w},${s},${e},${n}&geometryType=esriGeometryEnvelope&inSR=4326&outFields=FacilityName,Launch,LaunchType,Motorized&outSR=4326&f=geojson`).then(g=>(g.features||[]).filter(f=>f.properties.Launch!=='No').map(f=>({lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],name:f.properties.FacilityName,info:[f.properties.LaunchType,f.properties.Motorized==='Yes'?'motorized OK':''].filter(Boolean).join(' · '),src:'WDFW'})))
     :overpass(`[out:json][timeout:20];nwr["leisure"="slipway"](${s},${w},${n},${e});out center 200;`).then(d=>d.elements.map(el=>({lat:el.lat??el.center.lat,lng:el.lon??el.center.lon,name:el.tags?.name||'Boat launch',info:el.tags?.access||'',src:'OpenStreetMap'}))))
    .then(list=>list.forEach(p=>{const kk=p.lat.toFixed(4)+','+p.lng.toFixed(4);if(launchSeen.has(kk))return;launchSeen.set(kk,1);
      L.marker([p.lat,p.lng],{icon:LAUNCH_ICON,keyboard:false}).on('click',()=>openLaunch(p)).addTo(launches);}))
    .catch(()=>launchCells.delete(k));
  }
}
async function overpass(q){for(const ep of['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter']){try{const d=await getJSON(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}},15000);if(d.elements)return d;}catch(e){}}throw new Error('overpass');}

const SP={rainbow:['#9fb7a8','#e07a8a'],cutthroat:['#a8a27a','#d9483b'],brown:['#b08850','#c7462f'],brook:['#5e7451','#e9a23b'],tiger:['#9a8f62','#5b4a2a'],kokanee:['#a9b9c6','#c94a3a'],salmon:['#9fb0bd','#6e8796'],coho:['#9fb0bd','#c94a3a'],chinook:['#8ea2ae','#56707d'],steelhead:['#b3c3cc','#d88a93'],bass:['#7b8f45','#3e4f22'],perch:['#d8c25a','#4a5a2a'],walleye:['#b9a463','#6b5a2a'],crappie:['#c5cbb8','#4a4f45'],bluegill:['#6f8a6a','#e09a3b'],catfish:['#7b7466','#4a443a'],sturgeon:['#8a8f93','#5a5f63'],golden:['#e7c35a','#d9483b']};
function fishArt(species){const s=String(species||'').toLowerCase();let c=['#a9bcc8','#6b8796'];for(const k in SP)if(s.includes(k)){c=SP[k];break;}
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ec8d8"/><stop offset="1" stop-color="#123f66"/></linearGradient></defs><rect width="200" height="150" fill="url(#g)"/><g fill="none" stroke="#9ff3e8" stroke-opacity=".35" stroke-width="2"><path d="M0 120c30-12 60 12 100 0s70 12 100 0"/><path d="M0 135c30-12 60 12 100 0s70 12 100 0"/></g><g transform="translate(18 40)"><path d="M10 35C40 0 105 -2 135 30L165 8v58l-30-22C105 76 40 72 10 35z" fill="${c[0]}" stroke="#0b2a4a" stroke-width="2"/><path d="M28 38c30 6 70 6 105-4" stroke="${c[1]}" stroke-width="7" stroke-linecap="round" opacity=".85"/><path d="M70 12l10-12 14 14z" fill="${c[0]}" stroke="#0b2a4a" stroke-width="2"/><circle cx="34" cy="30" r="5" fill="#fff"/><circle cx="34" cy="30" r="2.5" fill="#0b2a4a"/></g></svg>`;
  return "url('data:image/svg+xml,"+encodeURIComponent(svg)+"')";}

const photoURLs=new Map();
function openCatch(c,m){
  let bg;if(c.photo){if(!photoURLs.has(c.id))photoURLs.set(c.id,URL.createObjectURL(c.photo));bg=`url('${photoURLs.get(c.id)}')`;}else bg=fishArt(c.species);
  const isNew=Date.now()-c.ts<3*864e5;
  const stats=[c.weight&&`<span>${ICON.w}${esc(c.weight)} lb</span>`,c.length&&`<span>${ICON.l}${esc(c.length)}″</span>`,c.depth&&`<span>${ICON.d}${esc(c.depth)} ft</span>`].filter(Boolean).join('');
  showCard(`<div class="ph" style="background-image:${bg}">${isNew?'<div class="ribbon">NEW</div>':''}</div>
   <div class="body"><div class="hd"><div class="av">ME</div><div style="min-width:0"><div class="nm">My catch</div><div class="sub">${ago(c.ts)} • ${esc(c.species||'Fish')}</div></div></div>
   <div class="note">${esc(c.note||(c.lure?'Caught on '+c.lure:'No notes'))}</div>

   <div class="stats">${stats}${stats?'':dirLink(c.lat,c.lng)}<button class="del" id="delCatch">Delete</button></div></div>`,m);
  $('#delCatch').onclick=async()=>{if(!confirm('Delete this catch?'))return;await dbDel(c.id);clusters.removeLayer(m);catchMarkers.delete(c.id);closeCard();toast('Catch deleted');};

function openStock(g,m){

   <div class="note">${g.total.toLocaleString()}${esc(size)} ${esc(sp.toLowerCase())} planted${g.plants.length>1?` in ${g.plants.length} releases`:''} in the last 30 days.</div>
   <div class="stats"><span>${ICON.f}${g.total.toLocaleString()}</span><span class="sub" style="font-weight:600">${new Date(g.ts).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span>${dirLink(g.lat,g.lng)}</div></div>`,m);

let photoBlob=null,gpsFix=null,useGPS=false,pickLatLng=null;
function openSheet(at){

async function shrink(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
    const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));const cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*k);cv.height=Math.round(img.naturalHeight*k);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);return await new Promise(r=>cv.toBlob(b=>r(b||file),'image/jpeg',.85));}
  catch(e){return file;}finally{URL.revokeObjectURL(url);}
}
async function onPhoto(e){const f=e.target.files[0];if(!f)return;photoBlob=await shrink(f);const u=URL.createObjectURL(photoBlob);$('#photoBox').style.backgroundImage=`url("${u}")`;$('#photoBox').classList.add('has');e.target.value='';}

  for(const k of['species','weight','length','lure','depth','note'])c[k]=$('#c_'+k).value.trim();
  try{await dbPut(c);}catch(e){toast('Could not save: '+e.message);return;}

async function geocode(q){
  try{const r=await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=${encodeURIComponent(q)}&viewbox=${map.getBounds().pad(3).toBBoxString()}`,{headers:{'Accept-Language':'en'}},9000);
    if(r.length)return r.map(x=>({name:x.display_name,lat:+x.lat,lng:+x.lon,bb:x.boundingbox&&[[+x.boundingbox[0],+x.boundingbox[2]],[+x.boundingbox[1],+x.boundingbox[3]]]}));}catch(e){}
  const c=map.getCenter();const p=await getJSON(`https://photon.komoot.io/api/?limit=6&lat=${c.lat}&lon=${c.lng}&q=${encodeURIComponent(q)}`,{},9000);
  return(p.features||[]).map(f=>{const r=f.properties,x=r.extent;return{name:[r.name,r.city,r.county,r.state].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],bb:x&&[[x[3],x[0]],[x[1],x[2]]]};});
}
let res=[];
function go(r){$('#results').style.display='none';$('#search').blur();if(r.bb)map.fitBounds(r.bb,{maxZoom:15,padding:[20,20]});else map.setView([r.lat,r.lng],14);}
$('#search').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;e.preventDefault();const q=e.target.value.trim();if(!q)return;
  const ll=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(ll)return go({lat:+ll[1],lng:+ll[2]});
  const box=$('#results');box.style.display='block';box.innerHTML='<div style="color:#6b7785">Searching…</div>';
  try{res=await geocode(q);if(!res.length){box.innerHTML='<div style="color:#6b7785">No results</div>';return;}if(res.length===1)return go(res[0]);
    box.innerHTML=res.map((r,i)=>`<div data-i="${i}">${esc(r.name)}</div>`).join('');}catch(err){box.innerHTML='<div style="color:#6b7785">Search failed</div>';}});

const me=L.layerGroup().addTo(map);
$('#locate').onclick=()=>map.locate({setView:true,maxZoom:15,enableHighAccuracy:true});
map.on('locationfound',e=>{me.clearLayers();L.circle(e.latlng,{radius:e.accuracy,color:'#1e8fe0',weight:1,fillOpacity:.12,interactive:false}).addTo(me);L.circleMarker(e.latlng,{radius:8,color:'#fff',weight:3,fillColor:'#1e8fe0',fillOpacity:1,interactive:false}).addTo(me);});
map.on('locationerror',e=>toast('Location unavailable'));

// ---------- go ----------
let t;map.on('moveend',()=>{clearTimeout(t);t=setTimeout(()=>{loadBands();loadLaunches();loadStocking();updLegend();},250);});
map.on('zoomend',updLegend);
map.attributionControl.addAttribution('Lake depth: <a href="https://ecology.wa.gov">WA Ecology</a>/USGS · <a href="https://wdfw.wa.gov">WDFW</a> · <a href="https://data.wa.gov/d/6fex-3r7d">data.wa.gov</a> · © <a href="https://www.openstreetmap.org/copyright">OSM</a>');
applyDepth();loadCatches();loadLaunches();loadStocking();
window.fishmap={map,clusters,dbPut,dbDel,addCatchMarker,openCatch,bands};
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Fishing Map</title>
<meta name="theme-color" content="#0b2a4a">
<meta name="description" content="Satellite fishing map with lake depth bands, saved spots, stocking, parking and hidden gems.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fishing Map">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="https://unpkg.com/suncalc@1.9.0/suncalc.js"></script>
<style>
:root{--teal:#2fd3a5;--blue:#1e8fe0;--navy:#0b2a4a;--orange:#f26a1b;--amber:#ffb627;--ink:#17202a;--grey:#6b7785;--line:#e8edf1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#0b1a12}
#map{position:fixed;inset:0;background:#1b2a1f}
button{font:inherit;cursor:pointer;border:0;color:inherit;background:none}
a{color:var(--blue)}
.leaflet-bands-pane{filter:drop-shadow(0 0 3px rgba(159,243,232,.95)) drop-shadow(0 0 9px rgba(94,200,216,.55))}
.leaflet-fallback-pane{filter:drop-shadow(0 0 3px rgba(159,243,232,.8)) drop-shadow(0 0 8px rgba(94,200,216,.4))}
#top{position:fixed;z-index:1000;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top));display:flex;gap:8px;max-width:560px;margin:0 auto}
#sbox{flex:1;position:relative}
#search{width:100%;height:46px;border-radius:23px;border:0;padding:0 16px 0 42px;font-size:16px;background:rgba(255,255,255,.96);box-shadow:0 4px 16px rgba(0,0,0,.25);outline:none;color:var(--ink)}
#sbox>svg{position:absolute;left:14px;top:13px;opacity:.55}
#results{position:absolute;top:52px;left:0;right:0;background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.25);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
#results div{padding:11px 16px;border-bottom:1px solid #eef1f4;font-size:14px}
.rbtn{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.96);box-shadow:0 4px 16px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;color:var(--ink);flex:none}
#locate{position:fixed;z-index:1000;right:14px;bottom:calc(164px + env(safe-area-inset-bottom))}
#add{position:fixed;z-index:1000;right:12px;bottom:calc(86px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;background:var(--blue);color:#fff;font-size:36px;line-height:1;box-shadow:0 6px 18px rgba(30,143,224,.55),0 2px 6px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
#tabbar{position:fixed;z-index:1000;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:2px;background:rgba(255,255,255,.97);border-radius:26px;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.28)}
#tabbar button{display:flex;align-items:center;gap:6px;padding:0 16px;min-height:44px;border-radius:22px;font-size:14px;font-weight:700;color:var(--grey)}
#tabbar button.on{background:var(--navy);color:#fff}
body.card-open #add,body.card-open #locate,body.card-open #tabbar,body.sheet-open #add,body.sheet-open #locate{display:none}
#legend{position:fixed;z-index:999;left:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:rgba(11,42,74,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:10px;padding:6px 7px;font-size:10px;display:none}
#legend .r{display:flex;align-items:center;gap:5px;height:13px}
#legend i{width:12px;height:9px;border-radius:2px;display:inline-block}
body.card-open #legend,body.sheet-open #legend{display:none!important}
#rleg{position:fixed;z-index:999;left:12px;bottom:calc(76px + env(safe-area-inset-bottom));background:rgba(11,42,74,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;border-radius:10px;padding:5px 7px;font-size:10px;display:none}
#rleg .r{display:flex;align-items:center;gap:5px;height:14px}#rleg i{width:12px;height:9px;border-radius:2px;display:inline-block;box-sizing:border-box}
body.card-open #rleg,body.sheet-open #rleg{display:none!important}
.rstrip{display:flex;align-items:center;gap:8px;margin:8px 0 0;padding:0 10px;min-height:34px;border-radius:10px;background:#eef3f6;color:#36505f;font-size:12px;font-weight:600;cursor:pointer}
.rstrip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rstrip b{font-size:16px}
.rstrip.red{background:#fde8e7;color:#c62828}.rstrip.orange{background:#fff1dc;color:#b45f00}.rstrip.amber{background:#fff8d6;color:#8a6500}
.rdisc{background:#fff4e0;border:1px solid #ffc46b;color:#7a4a00;border-radius:12px;padding:10px 12px;font-size:12.5px;font-weight:600;line-height:1.4;margin:8px 0}
.rrow{border-left:4px solid #f08c00;padding:6px 0 6px 10px;margin:6px 0}.rrow .rt{font-weight:700;font-size:13.5px;line-height:1.3}.rrow .rt a{color:var(--ink)}.rrow .sub{margin-top:3px;line-height:1.4}
.rpill{display:inline-block;color:#fff;border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-right:4px}
.dpop .dma{margin-top:6px;padding-top:6px;border-top:1px solid #eef1f3;font-size:11.5px;font-weight:600;color:#123f66;line-height:1.6}
.leaflet-rules-pane path.damzone,.leaflet-rules-pane path[class*=mpa-]{cursor:pointer}

.leaflet-control-attribution{font-size:9px;background:rgba(0,0,0,.45)!important;color:#dfe8ee;max-width:60vw;border-radius:6px 0 0 0;max-height:15px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer}
.leaflet-control-attribution.full{max-height:none;white-space:normal}
.leaflet-bottom.leaflet-right{margin-bottom:env(safe-area-inset-bottom)}
.leaflet-control-attribution a{color:#bfe6ff}
.pinw{position:relative;width:30px;height:40px}
.pinw .shadow{position:absolute;left:8px;bottom:-3px;width:14px;height:5px;border-radius:50%;background:rgba(0,0,0,.35);filter:blur(1px)}
.pinw svg{position:absolute;left:0;top:0;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}
.newpill{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);background:var(--orange);color:#fff;font-weight:800;font-size:10.5px;letter-spacing:.04em;padding:3px 8px;border-radius:10px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.newpill:after{content:"";position:absolute;left:50%;bottom:-4px;margin-left:-4px;border:4px solid transparent;border-bottom:0;border-top-color:var(--orange)}
.pin-sel svg{transform:scale(1.18);transform-origin:50% 100%}
.mini{width:20px;height:20px;border-radius:50%;background:rgba(11,42,74,.8);border:1.5px solid rgba(255,255,255,.9);display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800}
.mini.p{border-radius:6px;background:#2563c9}
.mini.p.w{border-color:#9ff3e8}
.drop{width:16px;height:16px;border-radius:50%;background:rgba(11,42,74,.85);border:2px solid #9ff3e8;display:flex;align-items:center;justify-content:center;box-shadow:0 0 6px rgba(159,243,232,.8)}
.clus{position:relative;width:44px;height:44px}
.clus .b{width:44px;height:44px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 3px 10px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.clus .n{position:absolute;right:-8px;top:-5px;min-width:22px;height:20px;padding:0 5px;border-radius:10px;background:var(--navy);color:#fff;border:2px solid #fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center}
.clus .newpill{bottom:52px}
.marker-cluster{background:none}.marker-cluster div{background:none}
.walklbl{background:var(--navy);color:#fff;border:0;border-radius:10px;font-weight:700;font-size:12px;padding:3px 8px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.walklbl:before{display:none}
/* card */
#card{position:fixed;z-index:1100;left:10px;right:10px;bottom:calc(14px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;transform:translateY(130%);transition:transform .28s cubic-bezier(.2,.8,.2,1)}
body.card-open #card{transform:none}
#card .row1{display:flex;min-height:142px}
#card .ph{position:relative;width:42%;flex:none;background:#123f66 center/cover no-repeat;overflow:hidden;border-radius:14px;margin:6px;display:flex;align-items:center;justify-content:center;font-size:54px}
#card .ribbon{position:absolute;left:-30px;top:12px;width:110px;transform:rotate(-45deg);background:var(--orange);color:#fff;text-align:center;font-size:11px;font-weight:800;letter-spacing:.05em;padding:3px 0;box-shadow:0 2px 4px rgba(0,0,0,.25)}
#card .body{flex:1;padding:12px 12px 8px 8px;display:flex;flex-direction:column;min-width:0}
#card .hd{display:flex;align-items:center;gap:8px;padding-right:30px}
.av{width:30px;height:30px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#fff;background:var(--blue)}
#card .nm{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{color:var(--grey);font-size:12px}
#card .sub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .note{margin:8px 0 6px;font-size:14.5px;line-height:1.3;flex:1;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
#card .stats{display:flex;gap:12px;align-items:center;font-size:13px;font-weight:600;flex-wrap:wrap}
#card .stats span{display:flex;align-items:center;gap:5px}
#card .x{position:absolute;right:2px;top:2px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#eef2f5 0 13px,transparent 14px);color:#556;font-size:15px;display:flex;align-items:center;justify-content:center}
.acts2{display:flex;border-top:1px solid var(--line)}
.acts2 button,.acts2 a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 9px;font-size:11px;font-weight:700;color:var(--navy);text-decoration:none}
.acts2 button:active{background:#f2f6f9}
.acts2 .on{color:var(--amber)}
.acts2 .danger{color:#c0392b}
/* sheet */
#sheet{position:fixed;z-index:1200;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#fff;border-radius:22px 22px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.35);padding:8px 16px calc(16px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:82vh;overflow-y:auto;overscroll-behavior:contain}
body.sheet-open #sheet{transform:none}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:#d5dbe0;margin:0 auto 8px}
#sheet h3{margin:2px 0 4px;font-size:19px}
#sheet .shx{position:absolute;right:5px;top:5px;width:44px;height:44px;border-radius:50%;background:radial-gradient(circle,#eef2f5 0 15px,transparent 16px);z-index:2;color:#556;font-size:16px}
.sec{margin:14px 0 6px;font-size:11px;font-weight:800;color:var(--grey);text-transform:uppercase;letter-spacing:.06em}
.big{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;background:#f3f7fa;margin:8px 0;font-weight:700;font-size:16px;text-align:left}
.big .ic{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff}
.big small{display:block;font-weight:500;color:var(--grey);font-size:12px}
.tog{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-bottom:1px solid var(--line)}
.tog small{display:block;color:var(--grey);font-size:12px}
.sw{position:relative;width:46px;height:28px;flex:none;border-radius:14px;background:#cfd8df;transition:background .2s}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:left .2s}
.sw.on{background:var(--teal)}.sw.on:after{left:21px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f label{display:block;font-size:11px;color:var(--grey);font-weight:700;margin:0 0 3px 2px;text-transform:uppercase;letter-spacing:.04em}
.f input,.inp{min-height:44px}
.f input,.f textarea,.inp{width:100%;border:1px solid #dde3e8;border-radius:10px;padding:9px 10px;font:inherit;font-size:16px;background:#f9fbfc;color:var(--ink)}
.f.full{grid-column:1/-1}
.photoBox{height:130px;border-radius:14px;background:#eef3f7 center/cover no-repeat;display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0 10px}
.pbtn{background:#fff;border-radius:22px;padding:0 16px;min-height:44px;font-size:14px;font-weight:600;box-shadow:0 2px 6px rgba(0,0,0,.15)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{display:inline-flex;align-items:center;min-height:44px;padding:0 13px;border-radius:22px;background:#eef3f7;font-size:13px;font-weight:600}
.chip.on{background:var(--navy);color:#fff}
.locLine{font-size:12px;color:var(--grey);margin:10px 2px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.locLine button{color:var(--blue);font-weight:700;font-size:12px;min-height:44px;padding:0 6px}
.acts{display:flex;gap:10px;margin-top:10px}
.acts button,.acts a{flex:1;height:46px;border-radius:23px;font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.primary{background:var(--blue);color:#fff!important}.ghost{background:#eef2f5;color:var(--ink)!important}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);cursor:pointer}
.li .ic{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-size:18px;background:#fff4dc}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mn{flex:1;min-width:0}
.score{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;background:conic-gradient(var(--teal) calc(var(--s)*1%),#dfe7ec 0);position:relative}
.score span{position:absolute;inset:4px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:14px}
.why{font-size:12.5px;color:#3a4652;line-height:1.3;margin-top:2px}
.note2{background:#fff7ec;border:1px solid #ffe2bf;color:#7a4a12;border-radius:12px;padding:9px 11px;font-size:12.5px;margin:8px 0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:14px}
.kv b{color:var(--grey);font-weight:600}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.pill{background:#eef5fa;border-radius:12px;padding:8px 10px;font-size:13px;font-weight:600;flex:1;min-width:44%}
.pill small{display:block;color:var(--grey);font-weight:500;font-size:11px}
details summary{cursor:pointer;color:var(--blue);font-weight:700;font-size:13px;margin:6px 0}
/* v4 */
.leaflet-pane > svg{pointer-events:none}
.leaflet-pane > svg .leaflet-interactive{pointer-events:visiblePainted}
.leaflet-creeks-pane svg .leaflet-interactive{pointer-events:stroke}
.snd{color:#fff;font:700 10.5px/14px -apple-system,Roboto,sans-serif;text-align:center;text-shadow:0 0 3px #0b2a4a,0 0 2px #0b2a4a;pointer-events:none}
.clab span,.crlab span{position:absolute;left:0;top:0;white-space:nowrap;pointer-events:none;font:700 10px -apple-system,Roboto,sans-serif}
.clab span{color:#fff;text-shadow:0 0 3px #0b2a4a,0 0 2px #0b2a4a}
.crlab span{color:#bff4ff;font-style:italic;font-size:11px;text-shadow:0 0 3px #062033,0 0 2px #062033}
.flow{width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1.5px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.flow.in{background:#1e8fe0}.flow.out{background:#0b2a4a}
.feat{width:18px;height:18px;border-radius:5px;background:rgba(11,42,74,.85);border:1.5px solid #9ff3e8;display:flex;align-items:center;justify-content:center}
.dpop .leaflet-popup-content-wrapper{border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.35)}
.dpop .leaflet-popup-content{margin:10px 12px;font:13px/1.3 -apple-system,Roboto,sans-serif;color:var(--ink)}
.dpop .dv{font-size:22px;font-weight:800;color:var(--navy)}
.dpop .ds{color:#3a4652;margin:2px 0 4px}
.dpop .db{font-size:11px;color:var(--grey)}
.dpop .dbtn{margin-top:7px;background:#eef5fa;border-radius:22px;padding:0 14px;min-height:44px;font-weight:700;font-size:12px;color:var(--blue)}
.badge{display:inline-flex;gap:6px;align-items:center;background:#e3f6fb;color:#0b4a66;border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;margin:6px 0 2px}
.seg{display:flex;background:#eef2f5;border-radius:12px;padding:3px;margin:6px 0}
.seg button{flex:1;padding:0 7px;min-height:44px;border-radius:10px;font-weight:700;font-size:13px;color:var(--grey)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.15)}
#toast{position:fixed;z-index:1300;left:50%;top:calc(104px + env(safe-area-inset-top));transform:translateX(-50%);background:rgba(11,42,74,.94);color:#fff;padding:8px 14px;border-radius:18px;font-size:13px;display:none;max-width:90vw;text-align:center}
/* v5 */
.moving .leaflet-bands-pane,.moving .leaflet-fallback-pane,.moving .leaflet-enc-pane{filter:none!important}
.leaflet-contours-pane canvas,.leaflet-enc-pane canvas{pointer-events:none}
#status{position:fixed;z-index:1250;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));max-width:min(92vw,520px);background:rgba(11,42,74,.86);color:#e8f6ff;font-size:12px;line-height:1.3;padding:6px 12px;border-radius:14px;display:none;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#upd{white-space:nowrap;position:fixed;z-index:1400;left:50%;transform:translateX(-50%);top:calc(64px + env(safe-area-inset-top));min-height:44px;padding:0 18px;border-radius:22px;background:var(--orange);color:#fff;font-weight:800;font-size:14px;display:none;align-items:center;gap:8px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
#results div{min-height:44px}
</style>
</head>
<body>
<div id="map"></div>
<div id="top">
  <div id="sbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="search" aria-label="Search lakes, rivers, places" type="search" placeholder="Search lakes, rivers, places" autocomplete="off" enterkeyhint="search">
    <div id="results"></div>
  </div>
  <button class="rbtn" id="layersBtn" aria-label="Layers" title="Layers">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e8fe0" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="#9ff3e8" stroke="#2a8fb5"/><path d="M3 12.5l9 5 9-5"/><path d="M3 17l9 5 9-5" stroke="#123f66"/></svg>
  </button>
</div>
<button class="rbtn" id="locate" aria-label="Locate me"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1e8fe0" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4" fill="#1e8fe0"/><circle cx="12" cy="12" r="8"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg></button>
<button id="add" aria-label="Add a catch or spot">+</button>
<div id="tabbar">
  <button data-tab="map" class="on"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</button>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(m,ms=2600){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',ms);}
const APP_VERSION='v6.0';window.APP_VERSION=APP_VERSION;
const inflight=new Set();
// opt.bb=[w,s,e,n] lets a request be cancelled when the map pans away; opt.signal cancels it explicitly. Cancelled requests reject with e.panned=true and never raise a status note.
async function getJSON(url,opt={},ms=25000){const{bb,signal,...o}=opt;const c=new AbortController();const h=setTimeout(()=>c.abort(),ms);const rec={bb,c,panned:false};if(bb)inflight.add(rec);
  if(signal){if(signal.aborted){rec.panned=true;c.abort();}else signal.addEventListener('abort',()=>{rec.panned=true;c.abort();});}
  try{const r=await fetch(url,{...o,signal:c.signal});if(!r.ok)throw new Error('HTTP '+r.status);const j=await r.json();if(j&&j.error)throw new Error(j.error.message||'error');return j;}
  catch(e){if(rec.panned){const x=new Error('cancelled');x.panned=true;throw x;}srcFail(url);throw e;}
  finally{clearTimeout(h);inflight.delete(rec);}}
function abortOffscreen(){if(typeof map==='undefined')return;const v=map.getBounds().pad(0.6);for(const r of inflight){const[w,s0,e,n]=r.bb;if(!v.intersects([[s0,w],[n,e]])){r.panned=true;r.c.abort();}}}
const SRC=[[/overpass|maps\.mail\.ru/,'OpenStreetMap (parking, ponds)'],[/hydro\.nationalmap/,'USGS creeks & water'],[/6lCKYNJLvwTXqrmp/,'WA Ecology lake depths'],[/encdirect/,'NOAA chart depths'],[/ngdc\.noaa/,'NOAA depth model'],[/data\.wa\.gov/,'WDFW stocking'],[/MarineProtectedAreas/,'WDFW marine protected areas'],[/Marine_Areas/,'WDFW marine areas'],[/geodataservices\.wdfw/,'WDFW access sites'],[/tigerweb/,'Census tribal/military boundaries'],[/NID_v1/,'USACE dam inventory'],[/fBc8EJBxQRMcHlei/,'NPS boundaries'],[/QVENGdaPbd4LUkLV/,'USFWS refuge boundaries'],[/open-meteo/,'weather']];
const srcNoted={};
function srcFail(url){if(!navigator.onLine)return;const m=SRC.find(([re])=>re.test(url));if(!m)return;const now=Date.now();if(now-(srcNoted[m[1]]||0)<180000)return;srcNoted[m[1]]=now;
  const recent=Object.keys(srcNoted).filter(k=>now-srcNoted[k]<20000);status(`Not responding right now: ${recent.join(', ')}. Showing what loaded.`,8000);}
function status(m,ms=6000){const t=$('#status');t.textContent=m;t.style.display='block';clearTimeout(t._h);if(ms)t._h=setTimeout(()=>t.style.display='none',ms);}
$('#status').onclick=()=>$('#status').style.display='none';
const sleep=ms=>new Promise(r=>setTimeout(()=>r(null),ms));
const within=(p,ms)=>Promise.race([p,sleep(ms)]);
function ago(t){const s=(Date.now()-t)/1000;if(s<60)return'now';if(s<3600)return Math.floor(s/60)+'m';if(s<86400)return Math.floor(s/3600)+'h';if(s<86400*30)return Math.floor(s/86400)+'d';if(s<86400*365)return Math.floor(s/86400/30)+'mo';return Math.floor(s/86400/365)+'y';}
const daysAgo=t=>Math.floor((Date.now()-t)/864e5);
const PAGES='https://jayceeninefive-star.github.io/fishing-map/';
const isIOS=/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent)&&('ontouchend' in document||/iPhone|iPad|iPod/.test(navigator.userAgent));
const prefs=JSON.parse(localStorage.getItem('fm3.layers')||'{}');
const L_DEF={contours:true,enc:true,water:true,creeks:true,features:true,bands:true,fallback:true,drops:true,stocked:true,launches:true,parking:false,catches:true,spots:true,rules:true};
const on=k=>prefs[k]??L_DEF[k];
function setPref(k,v){prefs[k]=v;localStorage.setItem('fm3.layers',JSON.stringify(prefs));}

// ---------- geometry (local metres) ----------
const R=6371008.8,D2R=Math.PI/180;
function hav(a,b){const dl=(b[0]-a[0])*D2R,dg=(b[1]-a[1])*D2R;const x=Math.sin(dl/2)**2+Math.cos(a[0]*D2R)*Math.cos(b[0]*D2R)*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function proj(lat0){const kx=Math.cos(lat0*D2R)*111320,ky=110540;return{f:(lat,lng)=>[lng*kx,lat*ky],i:(x,y)=>[y/ky,x/kx]};}
function ringArea(ring,P){let a=0;for(let i=0,n=ring.length;i<n;i++){const[p,q]=[P.f(ring[i][1],ring[i][0]),P.f(ring[(i+1)%n][1],ring[(i+1)%n][0])];a+=p[0]*q[1]-q[0]*p[1];}return Math.abs(a/2);}
function ringLen(ring,P){let s=0;for(let i=1;i<ring.length;i++){const p=P.f(ring[i-1][1],ring[i-1][0]),q=P.f(ring[i][1],ring[i][0]);s+=Math.hypot(q[0]-p[0],q[1]-p[1]);}return s;}
function segNear(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));const x=ax+t*dx,y=ay+t*dy;return[Math.hypot(px-x,py-y),x,y];}
// nearest point on a set of rings ([lng,lat] arrays); returns {d metres, ll [lat,lng]}
function nearestOnRings(lat,lng,rings){const P=proj(lat);const[px,py]=P.f(lat,lng);let best={d:Infinity,ll:null};
  for(const r of rings){if(r._bb){const b=r._bb;const dx=Math.max(b[0]-lng,0,lng-b[2])*Math.cos(lat*D2R)*111320,dy=Math.max(b[1]-lat,0,lat-b[3])*110540;if(Math.hypot(dx,dy)>best.d)continue;}
    for(let i=1;i<r.length;i++){const a=P.f(r[i-1][1],r[i-1][0]),b=P.f(r[i][1],r[i][0]);const[d,x,y]=segNear(px,py,a[0],a[1],b[0],b[1]);if(d<best.d)best={d,ll:P.i(x,y)};}}
  return best;}
function bbRing(r){let a=[180,90,-180,-90];for(const p of r){if(p[0]<a[0])a[0]=p[0];if(p[1]<a[1])a[1]=p[1];if(p[0]>a[2])a[2]=p[0];if(p[1]>a[3])a[3]=p[1];}r._bb=a;return r;}
function polys(g){return!g?[]:g.type==='Polygon'?[g.coordinates]:g.type==='MultiPolygon'?g.coordinates:[];}
function inRing(lng,lat,r){let c=false;for(let i=0,j=r.length-1;i<r.length;j=i++){const[xi,yi]=r[i],[xj,yj]=r[j];if((yi>lat)!==(yj>lat)&&lng<(xj-xi)*(lat-yi)/(yj-yi)+xi)c=!c;}return c;}
const COMPASS=['north','northeast','east','southeast','south','southwest','west','northwest'];
function bearing(a,b){const y=Math.sin((b[1]-a[1])*D2R)*Math.cos(b[0]*D2R),x=Math.cos(a[0]*D2R)*Math.sin(b[0]*D2R)-Math.sin(a[0]*D2R)*Math.cos(b[0]*D2R)*Math.cos((b[1]-a[1])*D2R);return(Math.atan2(y,x)/D2R+360)%360;}
const compass=deg=>COMPASS[Math.round(deg/45)%8];
function fmtDist(m){const mi=m/1609.344;return mi<0.2?Math.round(m*3.28084)+' ft':mi<10?mi.toFixed(1)+' mi':Math.round(mi)+' mi';}
function fmtWalk(m){return(m<1000?Math.round(m)+' m':(m/1000).toFixed(1)+' km')+` (~${Math.max(1,Math.round(m/80))} min walk)`;}

// ---------- palette ----------
const STOPS=[[0,'#9ff3e8'],[8,'#5ec8d8'],[18,'#2a8fb5'],[30,'#1b5f8c'],[45,'#123f66'],[70,'#0b2a4a']];
const hex=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
function rgb(ft){if(ft<=0)return hex(STOPS[0][1]);for(let i=1;i<STOPS.length;i++){if(ft<=STOPS[i][0]){const[a,ca]=STOPS[i-1],[b,cb]=STOPS[i];const t=(ft-a)/(b-a),x=hex(ca),y=hex(cb);return x.map((v,j)=>Math.round(v+(y[j]-v)*t));}}return hex(STOPS[STOPS.length-1][1]);}
const depthColor=ft=>'rgb('+rgb(ft).join(',')+')';

// ---------- map ----------
const qs=new URLSearchParams(location.search);
const shared=qs.get('lat')&&qs.get('lng')?{lat:+qs.get('lat'),lng:+qs.get('lng'),name:qs.get('name')||'Shared spot',z:+(qs.get('z')||16)}:null;
const sv=JSON.parse(localStorage.getItem('fm2.view')||'null');
const map=L.map('map',{zoomControl:false,worldCopyJump:true}).setView(shared?[shared.lat,shared.lng]:sv?[sv.lat,sv.lng]:[47.605,-122.06],shared?shared.z:sv?sv.z:12);
map.on('moveend',()=>{const c=map.getCenter();localStorage.setItem('fm2.view',JSON.stringify({lat:c.lat,lng:c.lng,z:map.getZoom()}));});
// v5: drop the costly glow filters while the map animates, cancel requests for cells we panned away from
map.on('movestart zoomstart',()=>map.getContainer().classList.add('moving'));
map.on('moveend zoomend',()=>{map.getContainer().classList.remove('moving');abortOffscreen();});
function netState(){if(!navigator.onLine)status('Offline · showing saved map and data',0);else if(/^Offline/.test($('#status').textContent))status('Back online',2500);}
addEventListener('offline',netState);addEventListener('online',()=>{netState();map.fire('moveend');});if(!navigator.onLine)setTimeout(netState,0);
map.attributionControl.setPrefix(false);
map.attributionControl.getContainer().addEventListener('click',e=>{if(e.target.tagName!=='A')e.currentTarget.classList.toggle('full');});
map.attributionControl.addAttribution('⚠ Not for navigation');
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,crossOrigin:true,attribution:'Imagery © <a href="https://www.esri.com">Esri</a>, Maxar, Earthstar'}).addTo(map);
map.createPane('fallback').style.zIndex=330;
map.createPane('bands').style.zIndex=340;
map.createPane('lines').style.zIndex=450;
const bandRenderer=L.svg({pane:'bands',padding:0.5});
const ArcExport=L.TileLayer.extend({
  initialize(u,o){this._u=u;L.TileLayer.prototype.initialize.call(this,u,o);},
  getTileUrl(c){const s=this.getTileSize();const nw=L.CRS.EPSG3857.project(this._map.unproject([c.x*s.x,c.y*s.y],c.z)),se=L.CRS.EPSG3857.project(this._map.unproject([(c.x+1)*s.x,(c.y+1)*s.y],c.z));
    return `${this._u}/exportImage?bbox=${nw.x},${se.y},${se.x},${nw.y}&bboxSR=3857&imageSR=3857&size=${s.x},${s.y}&format=png32&transparent=true&interpolation=RSP_BilinearInterpolation&renderingRule=${this.options.rule}&f=image`;}
});
const M_STEPS=[[2,-1.5],[-1.5,-3],[-3,-6],[-6,-9],[-9,-14],[-14,-21],[-21,-40],[-40,-12000]];
const ftMid=[0,7,15,25,37,55,90,150];
const rule=encodeURIComponent(JSON.stringify({rasterFunction:'Colormap',rasterFunctionArguments:{Colormap:ftMid.map((f,i)=>[i+1,...rgb(f)]),
  Raster:{rasterFunction:'Remap',rasterFunctionArguments:{InputRanges:M_STEPS.flatMap(([a,b])=>[b,a]),OutputValues:M_STEPS.map((_,i)=>i+1),NoDataRanges:[2,9000],AllowUnmatched:false}}}}));
const fallback=new ArcExport('https://gis.ngdc.noaa.gov/arcgis/rest/services/DEM_mosaics/DEM_global_mosaic/ImageServer',{rule,pane:'fallback',opacity:.82,maxZoom:19,maxNativeZoom:16,crossOrigin:true,attribution:'Depth: <a href="https://www.ncei.noaa.gov">NOAA NCEI</a>'});

// ---------- WA lake depth bands ----------
const WA=L.latLngBounds([45.5,-124.9],[49.1,-116.8]);
const BAND_URLS=['https://services.arcgis.com/6lCKYNJLvwTXqrmp/arcgis/rest/services/ECY/FeatureServer/4','https://gis.ecology.wa.gov/serverext/rest/services/GIS/Lakes/MapServer/9'];
const bandGroup=L.layerGroup();
const bands=new Map();
const cellsDone=new Map();
const lvlFor=z=>z<=12?0:z<=14?1:2;
const CELL=[0.16,0.06,0.025],TOL=[12,4,1.2];
const loHi=p=>[+p.LO_DEPTH_QT_FT||0,+p.HI_DEPTH_QT_FT||0];
function cdepth(p){const[lo,hi]=loHi(p);return(hi===0&&lo>5)?lo:hi;}           // depth of the band's outer contour
function bandDepth(p){const[lo,hi]=loHi(p);return(hi===0&&lo>5)?lo+2:Math.min(lo,hi);}
function loadBands(){
  if(!on('bands')||map.getZoom()<11||!map.getBounds().intersects(WA))return Promise.resolve();
  const z=map.getZoom(),lvl=lvlFor(z),cs=CELL[lvl],b=map.getBounds();const jobs=[];
  for(let x=Math.floor(b.getWest()/cs);x<=Math.floor(b.getEast()/cs);x++)for(let y=Math.floor(b.getSouth()/cs);y<=Math.floor(b.getNorth()/cs);y++){const k=lvl+':'+x+':'+y;
    if(cellsDone.has(k)){jobs.push(cellsDone.get(k));continue;}
    const pr=(async()=>{const q=`/query?where=1%3D1&geometry=${x*cs},${y*cs},${(x+1)*cs},${(y+1)*cs}&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=OBJECTID,Reachcode_NR,LO_DEPTH_QT_FT,HI_DEPTH_QT_FT&outSR=4326&maxAllowableOffset=${(TOL[lvl]/111000).toFixed(7)}&geometryPrecision=6&f=geojson`;
      const got=await Promise.all(BAND_URLS.map((u,i)=>getJSON(u+q,{},30000).then(g=>g.features?g.features.map(f=>(f._src=i,f)):null).catch(()=>null)));
      if(got.every(g=>!g)){cellsDone.delete(k);return;}
      if(!got[1])bandRetry.set(k,{q,lvl,t:Date.now()});
      addBandFeats([...(got[0]||[]),...(got[1]||[])],lvl);
    })();
    cellsDone.set(k,pr);jobs.push(pr);}
  // Ecology's old MapServer (GIS/Lakes) has lakes the online copy lacks (e.g. Pine Lake); retry it every 3 min while it's down
  for(const[k,r]of bandRetry){if(Date.now()-r.t<180000)continue;r.t=Date.now();getJSON(BAND_URLS[1]+r.q,{},30000).then(g=>{if(g.features){bandRetry.delete(k);addBandFeats(g.features.map(f=>(f._src=1,f)),r.lvl);}}).catch(()=>{});}
  return Promise.all(jobs);
}
const bandRetry=new Map();
function addBandFeats(feats,lvl){
  const have0=new Set([...bands.values()].filter(v=>v.src===0).map(v=>v.reach));feats.filter(f=>f._src===0).forEach(f=>have0.add(f.properties.Reachcode_NR));
  for(const f of feats){const id=f._src+':'+(f.id??f.properties.OBJECTID);const r0=f.properties.Reachcode_NR;
    if(f._src>0&&have0.has(r0))continue;
    const old=bands.get(id);if(old&&old.lvl>=lvl)continue;
    const d=bandDepth(f.properties),col=depthColor(d);
    const layer=L.geoJSON(f,{renderer:bandRenderer,pane:'bands',smoothFactor:.6,style:{fillColor:col,fillOpacity:.9,color:col,weight:.8,opacity:.9}});
    const reach=r0||('id'+id);
    layer.on('click',e=>{L.DomEvent.stop(e);tapLake(e.latlng,reach);});
    if(old)bandGroup.removeLayer(old.layer);bands.set(id,{lvl,layer,d,f,reach,src:f._src});bandGroup.addLayer(layer);}
  [...bands.values()].sort((a,b)=>a.d-b.d).forEach(v=>v.layer.bringToFront());
  lakeCache.clear();if(typeof remarkAll==='function')setTimeout(remarkAll,0);
}
function applyDepth(){
  on('fallback')?fallback.addTo(map):map.removeLayer(fallback);
  if(on('bands')){bandGroup.addTo(map);loadBands();}else map.removeLayer(bandGroup);
  updLegend();
}
const LEG=[0,10,20,30,45,60];
$('#legend').innerHTML=LEG.map((f,i)=>`<div class="r"><i style="background:${depthColor(f)}"></i>${f}${i===LEG.length-1?'+':''} ft</div>`).join('');
function updLegend(){$('#legend').style.display=((on('bands')||on('fallback'))&&map.getZoom()>=13)?'block':'none';if(typeof updRulesLegend==='function')updRulesLegend();}

// ---------- lake analysis ----------
const lakeCache=new Map();
function lakeBands(reach){return[...bands.values()].filter(v=>v.reach===reach);}
function analyzeLake(reach){
  if(lakeCache.has(reach))return lakeCache.get(reach);
  const bs=lakeBands(reach);if(!bs.length)return null;
  let bnds=null,area=0,maxD=0;const contours=new Map();
  const c0=bs[0].layer.getBounds().getCenter();const P=proj(c0.lat);
  for(const v of bs){const p=v.f.properties;const[lo,hi]=loHi(p);maxD=Math.max(maxD,lo,hi);const cd=cdepth(p);
    const lb=v.layer.getBounds();bnds=bnds?bnds.extend(lb):L.latLngBounds(lb.getSouthWest(),lb.getNorthEast());
    for(const poly of polys(v.f.geometry)){area+=ringArea(poly[0],P);for(let i=1;i<poly.length;i++)area-=ringArea(poly[i],P);
      if(!contours.has(cd))contours.set(cd,[]);contours.get(cd).push(bbRing(poly[0]));}}
  const depths=[...contours.keys()].sort((a,b)=>a-b);
  const edge=contours.get(depths[0])||[];
  // steepest drop-offs: closest approach between contour h and h+10 (or h+5)
  const cands=[];
  for(const h of depths){const h2=contours.has(h+10)?h+10:null;if(h2==null)continue;
    for(const r of contours.get(h)){const step=Math.max(1,Math.floor(r.length/140));
      for(let i=0;i<r.length;i+=step){const[lng,lat]=r[i];const n=nearestOnRings(lat,lng,contours.get(h2));if(n.d<Infinity)cands.push({from:h,to:h2,d:n.d,ll:[(lat+n.ll[0])/2,(lng+n.ll[1])/2]});}}}
  cands.forEach(c=>c.k=c.from===0?c.d*1.4:c.d);cands.sort((a,b)=>a.k-b.k);
  const drops=[];for(const c of cands){if(c.d>45)continue;if(drops.every(o=>hav(o.ll,c.ll)>180))drops.push(c);if(drops.length>=3)break;}
  const center=bnds.getCenter();const rad=hav([bnds.getSouth(),bnds.getWest()],[bnds.getNorth(),bnds.getEast()])/2;
  drops.forEach(dp=>{const dd=hav([center.lat,center.lng],dp.ll);dp.where=dd<rad*0.2?'middle of the lake':`${compass(bearing([center.lat,center.lng],dp.ll))} side`;});
  // steepness per band (mean width of each 5 ft band)
  const res={reach,bounds:bnds,center,areaM2:area,acres:area/4046.86,maxDepth:maxD,bandCount:bs.length,depths,edge,drops,contours};
  lakeCache.set(reach,res);return res;
}
function lakeAt(lat,lng,pad=60){let best=null;const seen=new Set();for(const v of bands.values()){if(seen.has(v.reach))continue;seen.add(v.reach);const lk=analyzeLake(v.reach);if(!lk)continue;
  if(!lk.bounds.pad(0.05).contains([lat,lng])){const n0=nearestOnRings(lat,lng,lk.edge);if(n0.d>pad)continue;}
  const n=nearestOnRings(lat,lng,lk.edge);const inside=lk.edge.some(r=>inRing(lng,lat,r));const d=inside?0:n.d;if(d<=pad&&(!best||d<best.d))best={lk,d};}
  return best&&best.lk;}
const nhdNames=new Map();
async function lakeNames(reaches){const need=reaches.filter(r=>!nhdNames.has(r)&&/^\d{14}$/.test(r));
  if(need.length){try{const j=await getJSON(`https://hydro.nationalmap.gov/arcgis/rest/services/nhd/MapServer/12/query?where=${encodeURIComponent(`reachcode IN (${need.map(r=>`'${r}'`).join(',')})`)}&outFields=gnis_name,reachcode,areasqkm&returnGeometry=false&f=json`,{},15000);
    for(const f of j.features||[]){const a=f.attributes;nhdNames.set(a.REACHCODE||a.reachcode,a.GNIS_NAME||a.gnis_name||null);}}catch(e){}need.forEach(r=>{if(!nhdNames.has(r))nhdNames.set(r,null);});}
  return reaches.map(r=>nhdNames.get(r));}
function lakeName(lk){const n=nhdNames.get(lk.reach);if(n)return n;const w=wdfwLakes.find(p=>lk.bounds.contains([p.lat,p.lng]));return w?w.name:'Unnamed lake';}

// ---------- WDFW lakes (names/access), access sites, stocking ----------
const WDFW='https://geodataservices.wdfw.wa.gov/arcgis/rest/services/ApplicationServices/FishWA_2014_AllLakes_PROD/MapServer';
let wdfwLakes=[];let lakesLoaded=null;

const AB={LTL:'LITTLE',UPR:'UPPER',LWR:'LOWER',N:'NORTH',S:'SOUTH',E:'EAST',W:'WEST',MT:'MOUNT',ST:'SAINT',DORTHY:'DOROTHY'};

// ---------- stocking ----------
function loadStocking(){
  if(stockLoaded||!map.getBounds().intersects(WA)||map.getZoom()<7)return stockLoaded||Promise.resolve();
  stockLoaded=(async()=>{try{
    const since=new Date(Date.now()-30*864e5).toISOString().slice(0,10);
    const [rows,lakes,hl]=await Promise.all([
      getJSON(`https://data.wa.gov/resource/6fex-3r7d.json?$where=${encodeURIComponent(`release_start_date >= '${since}'`)}&$order=release_start_date%20DESC&$limit=3000&$select=release_location,county,species,number_released,number_of_fish_per_pound,release_start_date,lifestage`,{},40000),
      loadWdfwLakes(),getJSON(`${WDFW}/24/query?where=1%3D1&outFields=*&outSR=4326&f=geojson`,{},40000).catch(()=>({features:[]}))]);
    const idx=new Map();
    for(const p of lakes)idx.set(nkey(p.name)+'|'+String(p.county||'').slice(0,4).toUpperCase(),{lat:p.lat,lng:p.lng,name:p.name});
    for(const f of hl.features||[]){const p={};for(const k in f.properties)p[k.split('.').pop()]=f.properties[k];const k=nkey(p.LakeMapName)+'|'+String(p.CountyName||'').slice(0,4).toUpperCase();if(!idx.has(k))idx.set(k,{lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],name:p.LakeMapName+' Lake'});}
    const g=new Map();
    for(const r of rows){const loc=r.release_location;const cs=[...loc.matchAll(/\(([A-Z]{4})[A-Z]*\)/g)];if(!cs.length)continue;const last=cs[cs.length-1];const cty=last[1];
      // "ANTILON LK - NORTH (UPPER) (CHEL)", "HOG (CANYON) LK (SPOK)": county is the LAST 4-letter group; try the name with and without the other parenthesised words
      const base=loc.slice(0,last.index)+loc.slice(last.index+last[0].length);const hit=idx.get(nkey(base)+'|'+cty)||idx.get(nkey(base.replace(/\([^)]*\)/g,' '))+'|'+cty)||idx.get(nkey(base.replace(/\b(NORTH|SOUTH|N|S)\b/g,' '))+'|'+cty);if(!hit)continue;
      const x=g.get(r.release_location)||{name:hit.name,county:(r.county||'').trim(),lat:hit.lat,lng:hit.lng,plants:[]};x.plants.push(r);g.set(r.release_location,x);}
    stockGroups=[...g.values()];
    for(const s of stockGroups){s.ts=Date.parse(s.plants[0].release_start_date);s.total=s.plants.reduce((a,p)=>a+(+p.number_released||0),0);s.species=[...new Set(s.plants.map(p=>p.species))];
      s.isNew=Date.now()-s.ts<14*864e5;const m=L.marker([s.lat,s.lng],{icon:pinIcon(s.isNew,FISHG),isNew:s.isNew,keyboard:false});m.on('click',()=>openStock(s,m));s.marker=m;addPin('stocked',m);}
  }catch(e){stockLoaded=null;console.warn('stocking',e.message);}})();
  return stockLoaded;
}
const stockNear=lk=>stockGroups.filter(s=>lk.bounds.pad(0.1).contains([s.lat,s.lng]));

// ---------- WDFW access sites (launches + parking) & OSM ----------
const access=new Map();const accessCells=new Map();
const LAUNCH_ICON=L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],html:'<div class="mini"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 15l3 5h12l3-5z"/><path d="M12 15V4l6 8h-6"/></svg></div>'});
const P_ICON=L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],html:'<div class="mini p">P</div>'});
const PW_ICON=L.divIcon({className:'',iconSize:[20,20],iconAnchor:[10,10],html:'<div class="mini p w">P</div>'});
function cellsFor(b,cs){const out=[];for(let x=Math.floor(b.getWest()/cs);x<=Math.floor(b.getEast()/cs);x++)for(let y=Math.floor(b.getSouth()/cs);y<=Math.floor(b.getNorth()/cs);y++)out.push([x,y,x*cs,y*cs,(x+1)*cs,(y+1)*cs]);return out;}
function loadAccess(b){
  if(!b.intersects(WA))return Promise.resolve();
  return Promise.all(cellsFor(b,0.1).map(([x,y,w,s,e,n])=>{const k=x+':'+y;if(accessCells.has(k))return accessCells.get(k);
    const pr=getJSON(`${WDFW}/0/query?where=1%3D1&geometry=${w},${s},${e},${n}&geometryType=esriGeometryEnvelope&inSR=4326&outFields=ObjectID,FacilityName,Motorized,Restrooms,Launch,LaunchType&outSR=4326&f=geojson`)
      .then(g=>{for(const f of g.features||[]){const p=f.properties,id='w'+(p.ObjectID??f.id);if(access.has(id))continue;
        const a={id,src:'WDFW',lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],name:p.FacilityName||'WDFW water access',launch:p.Launch&&p.Launch!=='No',launchType:p.LaunchType,motorized:p.Motorized,restrooms:p.Restrooms};access.set(id,a);
        if(a.launch){a.lm=L.marker([a.lat,a.lng],{icon:LAUNCH_ICON,keyboard:false}).on('click',()=>openLaunch(a));launchLayer.addLayer(a.lm);}
        const pk={id:'pw'+id,src:'WDFW',wdfw:true,lat:a.lat,lng:a.lng,name:a.name,kind:'lot',site:a};parking.set(pk.id,pk);addParkMarker(pk);}})
      .catch(()=>accessCells.delete(k));accessCells.set(k,pr);return pr;}));
}
let opFailUntil=0,opBusy=Promise.resolve();
async function overpass(q,ms=20000){if(Date.now()<opFailUntil)throw new Error('Overpass cooling down');
  const run=async()=>{for(const ep of['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter']){if(Date.now()<opFailUntil)break;try{const d=await getJSON(ep,{method:'POST',body:'data='+encodeURIComponent(q),headers:{'Content-Type':'application/x-www-form-urlencoded'}},ms);if(d.elements)return d;}catch(e){}}
    opFailUntil=Date.now()+120000;throw new Error('Overpass unavailable');};
  const pr=opBusy.then(run,run);opBusy=pr.catch(()=>{});return pr;}
const osm=new Map();const osmCells=new Map();
function osmKind(t){if(t.amenity==='parking')return'parking';if(t.leisure==='slipway')return'slipway';if(t.leisure==='fishing'||t.fishing)return'fishing';if(t.man_made==='pier')return'pier';if(t.leisure==='marina')return'marina';if(t.leisure==='park'||t.leisure==='nature_reserve')return'park';if(t.waterway==='waterfall'||t.waterway==='dam'||t.waterway==='weir'||t.natural==='spring')return'feat';return null;}
function loadOSM(b){
  return Promise.all(cellsFor(b,0.05).map(([x,y,w,s,e,n])=>{const k=x+':'+y;if(osmCells.has(k))return osmCells.get(k);
    const bb=`${s},${w},${n},${e}`;
    const pr=overpass(`[out:json][timeout:25];(nwr["amenity"="parking"](${bb});nwr["leisure"="slipway"](${bb});nwr["leisure"="fishing"](${bb});nwr["man_made"="pier"](${bb});nwr["leisure"="marina"](${bb});nwr["leisure"="park"](${bb});node["waterway"~"^(waterfall|dam|weir)$"](${bb});node["natural"="spring"](${bb});way["waterway"~"^(dam|weir)$"](${bb}););out center tags 700;way["natural"="water"](${bb});out geom 400;`)
      .then(d=>{for(const el of d.elements){const t=el.tags||{};if(el.geometry&&t.natural==='water'){osmWater(el);continue;}const kind=osmKind(t);if(!kind)continue;const id=el.type[0]+el.id;if(osm.has(id))continue;
        const o={id,kind,t,lat:el.lat??el.center?.lat,lng:el.lon??el.center?.lon};if(o.lat==null)continue;osm.set(id,o);
        if(kind==='slipway'&&!(t.access==='private'||t.access==='no')&&!isWA(o)){o.lm=L.marker([o.lat,o.lng],{icon:LAUNCH_ICON,keyboard:false}).on('click',()=>openLaunch({src:'OpenStreetMap',lat:o.lat,lng:o.lng,name:t.name||'Boat launch',launchType:t.surface||'',access:t.access}));launchLayer.addLayer(o.lm);}
        if(kind==='feat'){osmFeat(o);continue;}
        if(kind==='parking'){const pk=parkFromOSM(o);if(pk){parking.set(pk.id,pk);pendingPark.push(pk);}}}
        return true;})
      .catch(()=>{osmCells.delete(k);return false;});pr._bb=cellBB([w,s,e,n]);osmCells.set(k,pr);return pr;}));
}
const isWA=o=>WA.contains([o.lat,o.lng])&&access.size>0;
function parkFromOSM(o){const t=o.t;if(['private','no'].includes(t.access))return null;
  const street=['street_side','lane','on_street'].includes(t.parking)||t.parking==='layby';
  return{id:'po'+o.id,src:'OpenStreetMap',lat:o.lat,lng:o.lng,name:t.name||(street?'Street parking':'Parking lot'),kind:street?'street':'lot',
    surface:t.parking,fee:t.fee==='yes'?'Paid':t.fee==='no'?'Free':null,cap:t.capacity||null,access:t.access||null,hours:t.opening_hours||null,osmId:o.id};}

const parking=new Map();let pendingPark=[];
const waterRings=[];

function waterEdge(lat,lng){const rings=[...waterRings];
  const lk=lakeAt(lat,lng,500);if(lk)rings.push(...lk.edge);return nearestOnRings(lat,lng,rings);}
function addParkMarker(pk){if(pk.m)return;pk.m=L.marker([pk.lat,pk.lng],{icon:pk.wdfw?PW_ICON:P_ICON,keyboard:false}).on('click',()=>openParking(pk));parkLayer.addLayer(pk.m);}
async function loadParking(){
  if(!on('parking')||map.getZoom()<13)return;
  const b=map.getBounds().pad(0.2);
  await Promise.all([loadAccess(b),loadWater(b),loadOSM(b),loadBands()]);
  const keep=[];
  for(const pk of pendingPark){const w=waterEdge(pk.lat,pk.lng);pk.water=w;const nearLaunch=[...access.values()].some(a=>a.launch&&hav([a.lat,a.lng],[pk.lat,pk.lng])<400);

let db;
function idb(){return db?Promise.resolve(db):new Promise((res,rej)=>{const r=indexedDB.open('fishmap',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('catches'))d.createObjectStore('catches',{keyPath:'id'});if(!d.objectStoreNames.contains('spots'))d.createObjectStore('spots',{keyPath:'id'});};r.onsuccess=()=>{db=r.result;res(db);};r.onerror=()=>rej(r.error);});}
async function dbAll(st){const d=await idb();return new Promise((res,rej)=>{const q=d.transaction(st).objectStore(st).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
async function dbPut1(st,o){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');const fail=()=>rej(t.error||new Error('storage error'));t.oncomplete=res;t.onerror=fail;t.onabort=fail;t.objectStore(st).put(o);});}
// Safari private mode (and some WebKit builds) can't store Blobs in IndexedDB: fall back to storing the photo as a data URL string.
async function dbPut(st,o){try{return await dbPut1(st,o);}catch(e){if(o.photo instanceof Blob){o.photo=await toDataURL(o.photo);return dbPut1(st,o);}throw e;}}
async function dbDel(st,id){const d=await idb();return new Promise((res,rej)=>{const t=d.transaction(st,'readwrite');t.objectStore(st).delete(id);t.oncomplete=res;t.onerror=()=>rej(t.error);});}

let myPos=null;
let geoErr=null;
function getMe(force){return new Promise(res=>{if(myPos&&!force&&Date.now()-myPos.t<120000)return res(myPos);if(!navigator.geolocation)return res(null);
  navigator.geolocation.getCurrentPosition(p=>{myPos={lat:p.coords.latitude,lng:p.coords.longitude,acc:p.coords.accuracy,t:Date.now()};drawMe();res(myPos);},err=>{geoErr=err&&err.code;res(null);},{enableHighAccuracy:true,timeout:9000,maximumAge:60000});});}
function drawMe(){me.clearLayers();if(!myPos)return;L.circle([myPos.lat,myPos.lng],{radius:myPos.acc,color:'#1e8fe0',weight:1,fillOpacity:.12,interactive:false}).addTo(me);L.circleMarker([myPos.lat,myPos.lng],{radius:8,color:'#fff',weight:3,fillColor:'#1e8fe0',fillOpacity:1,interactive:false}).addTo(me);}
$('#locate').onclick=async()=>{const p=await getMe(true);if(p)map.setView([p.lat,p.lng],Math.max(map.getZoom(),15));else toast(geoErr===1?'Location is blocked. Allow location for this site in your browser settings':!window.isSecureContext?'Location needs https':'Location unavailable right now. Try again outside or with GPS on',4500);};

// ---------- directions ----------
async function openDirections(o){
  const ll=`${o.lat},${o.lng}`;
  const links=`<a class="primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${ll}&travelmode=driving">Google Maps</a>`+
    (isIOS?`<a class="ghost" target="_blank" rel="noopener" href="https://maps.apple.com/?daddr=${ll}&dirflg=d">Apple Maps</a>`:'')+
    `<a class="ghost" target="_blank" rel="noopener" href="https://waze.com/ul?ll=${ll}&navigate=yes">Waze</a>`;
  openSheet(`<h3>Directions</h3><div class="sub">to ${esc(o.name||'this spot')}</div>
    <div class="pillrow"><div class="pill" id="dDist"><small>Straight line</small>Locating you…</div><div class="pill" id="dDrive"><small>Drive (rough)</small>…</div></div>
    <div class="acts">${links}</div><p class="sub" style="margin-top:10px">Routes can end at private property: use public access only. Drive time comes from the free OSRM demo router and is only a rough estimate. Your maps app has the real route and traffic.</p>`,'dir');
  const p=await getMe();lineLayer.clearLayers();
  if(!p){$('#dDist').innerHTML='<small>Straight line</small>Turn on location';$('#dDrive').innerHTML='<small>Drive (rough)</small>n/a';return;}
  const d=hav([p.lat,p.lng],[o.lat,o.lng]);
  if($('#dDist'))$('#dDist').innerHTML=`<small>Straight line</small>${fmtDist(d)}`;
  L.polyline([[p.lat,p.lng],[o.lat,o.lng]],{pane:'lines',color:'#fff',weight:5,opacity:.85,dashArray:'2 10',lineCap:'round',interactive:false}).addTo(lineLayer);
  L.polyline([[p.lat,p.lng],[o.lat,o.lng]],{pane:'lines',color:'#f26a1b',weight:3,dashArray:'2 10',lineCap:'round',interactive:false}).addTo(lineLayer);
  map.fitBounds(L.latLngBounds([[p.lat,p.lng],[o.lat,o.lng]]),{paddingTopLeft:[30,80],paddingBottomRight:[30,Math.round(innerHeight*0.45)],maxZoom:15});
  if(d>400000){$('#dDrive').innerHTML='<small>Drive (rough)</small>too far to estimate';return;}
  try{const r=await getJSON(`https://router.project-osrm.org/route/v1/driving/${p.lng},${p.lat};${o.lng},${o.lat}?overview=false`,{},10000);const rt=r.routes&&r.routes[0];
    if(rt&&$('#dDrive')){const mins=Math.round(rt.duration/60);$('#dDrive').innerHTML=`<small>Drive (rough)</small>${mins<60?mins+' min':Math.floor(mins/60)+' h '+(mins%60)+' min'} · ${fmtDist(rt.distance)}`;}}
  catch(e){if($('#dDrive'))$('#dDrive').innerHTML='<small>Drive (rough)</small>unavailable';}
}

// ---------- find parking ----------
async function findParking(o){
  toast('Looking for parking…',10000);
  const b=L.latLngBounds([o.lat-0.012,o.lng-0.018],[o.lat+0.012,o.lng+0.018]);
  const osmP=loadOSM(b);await within(Promise.all([loadAccess(b).catch(()=>{}),loadWaters(b).catch(()=>{}),osmP.catch(()=>{})]),9000);
  const osmOK=await within(osmP.then(r=>r.every(Boolean)).catch(()=>false),0);
  pendingPark.forEach(addParkMarker);pendingPark=[];
  let best=null;for(const pk of parking.values()){const d=hav([pk.lat,pk.lng],[o.lat,o.lng]);if(d<2500&&(!best||d<best.d))best={pk,d};}
  if(!best){toast(osmOK?'No public parking found nearby in OSM or WDFW data':'No WDFW parking nearby, and OpenStreetMap is busy. Try again in a minute');return;}
  $('#toast').style.display='none';
  if(!on('parking')){setPref('parking',true);parkLayer.addTo(map);}
  const isLake=o.kind==='lake';
  let tgt={ll:[o.lat,o.lng],label:o.kind==='spot'?'spot':o.kind==='launch'?'launch':'spot'};
  if(isLake||o.kind==='stock'){const lk=o.lake||lakeAt(o.lat,o.lng,400);if(lk){const n=nearestOnRings(best.pk.lat,best.pk.lng,lk.edge);tgt={ll:n.ll,label:'water'};}}
  const lk2=(isLake||o.kind==='stock')&&(o.lake||lakeAt(o.lat,o.lng,400));const fb=lk2?lk2.bounds.extend([best.pk.lat,best.pk.lng]):L.latLngBounds([[best.pk.lat,best.pk.lng],tgt.ll]).pad(0.8);
  map.fitBounds(fb,{maxZoom:lk2?16:17,paddingTopLeft:[20,70],paddingBottomRight:[20,230]});
  setTimeout(()=>openParking(best.pk,tgt),350);
}

const t12=s=>{if(!s)return'–';const d=s instanceof Date?s:new Date(s);return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'});};
const hm=iso=>{const[h,m]=iso.slice(11,16).split(':').map(Number);return `${(h%12)||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`;};
async function conditions(lat,lng){
  const j=await getJSON(`https://api.open-meteo.com/v1/forecast?latitude=${lat.toFixed(4)}&longitude=${lng.toFixed(4)}&current=temperature_2m,wind_speed_10m,wind_direction_10m,wind_gusts_10m,surface_pressure&hourly=surface_pressure&daily=sunrise,sunset&past_days=1&forecast_days=2&timezone=auto&temperature_unit=fahrenheit&wind_speed_unit=mph`,{},12000);
  const cur=j.current;const hr=cur.time.slice(0,13);let i=j.hourly.time.findIndex(t=>t.slice(0,13)===hr);if(i<0)i=j.hourly.time.length-1;
  const p0=j.hourly.surface_pressure[Math.max(0,i-3)],p1=j.hourly.surface_pressure[i];const dp=p1-p0;
  const di=j.daily.time.indexOf(cur.time.slice(0,10));
  return{temp:Math.round(cur.temperature_2m),wind:Math.round(cur.wind_speed_10m),gust:Math.round(cur.wind_gusts_10m||0),dir:compass(cur.wind_direction_10m).replace('north','N').replace('south','S').replace('east','E').replace('west','W'),
    pres:Math.round(cur.surface_pressure),trend:dp>1?'rising':dp<-1?'falling':'steady',dp,sunrise:di>=0?hm(j.daily.sunrise[di]):'–',sunset:di>=0?hm(j.daily.sunset[di]):'–'};
}
function solunar(lat,lng){
  if(!window.SunCalc)return null;const d0=new Date();d0.setHours(0,0,0,0);
  let mx={a:-9},mn={a:9};for(let m=0;m<=1440;m+=10){const t=new Date(d0.getTime()+m*6e4);const a=SunCalc.getMoonPosition(t,lat,lng).altitude;if(a>mx.a)mx={a,t};if(a<mn.a)mn={a,t};}
  const refine=(c,sgn)=>{let best=c;for(let k=-10;k<=10;k++){const t=new Date(c.t.getTime()+k*6e4);const a=SunCalc.getMoonPosition(t,lat,lng).altitude;if(sgn*a>sgn*best.a)best={a,t};}return best.t;};
  const up=refine(mx,1),down=refine(mn,-1);const mt=SunCalc.getMoonTimes(d0,lat,lng);const ill=SunCalc.getMoonIllumination(new Date());
  const win=(t,h)=>({s:new Date(t.getTime()-h*36e5),e:new Date(t.getTime()+h*36e5)});
  const majors=[up,down].map(t=>win(t,1)),minors=[mt.rise,mt.set].filter(Boolean).map(t=>win(t,.5));
  const ph=ill.phase;const name=ph<.03||ph>.97?'New moon':ph<.22?'Waxing crescent':ph<.28?'First quarter':ph<.47?'Waxing gibbous':ph<.53?'Full moon':ph<.72?'Waning gibbous':ph<.78?'Last quarter':'Waning crescent';
  const now=Date.now();const all=[...majors.map(w=>({...w,k:'major'})),...minors.map(w=>({...w,k:'minor'}))].sort((a,b)=>a.s-b.s);
  const cur=all.find(w=>w.s<=now&&now<=w.e),next=all.find(w=>w.s>now);
  return{majors,minors,moon:`${name}, ${Math.round(ill.fraction*100)}% lit`,cur,next};
}

  for(const c of creeks.values())for(const l of c.lines){if(c.ap||l.length<2)continue;const s=l[0],e=l[l.length-1];
    const chk=(p,q,dir)=>{if(!b.contains([p[1],p[0]]))return;const n=nearestOnRings(p[1],p[0],w.outer);if(n.d>35)return;if(w.outer.some(r=>inRing(q[0],q[1],r))&&dir==='in')return;
      const brg=dir==='in'?bearing([q[1],q[0]],[p[1],p[0]]):bearing([p[1],p[0]],[q[1],q[0]]);out.push({creek:c,dir,ll:[p[1],p[0]],brg,w});};
    const rev=c.flowdir===0;chk(rev?s:e,rev?l[1]:l[l.length-2],'in');chk(rev?e:s,rev?l[l.length-2]:l[1],'out');}

    for(const f of w.flows){const k=f.ll[0].toFixed(5)+f.ll[1].toFixed(5)+f.dir;if(flowMarks.has(k))continue;flowMarks.set(k,f);
      L.marker(f.ll,{icon:arrowIcon(f.brg,f.dir),keyboard:false,zIndexOffset:-300}).on('click',e=>{L.DomEvent.stop(e);openFlow(f);}).addTo(flowGroup);}}},400);}
function openFlow(f){const nm=f.creek.name||'Unnamed creek';const o={kind:'flow',ruleName:f.creek.name||null,lat:f.ll[0],lng:f.ll[1],name:`${nm} ${f.dir==='in'?'inflow':'outflow'}`,saveType:'hot',reopen:()=>openFlow(f)};

function applyV4(k){

  if(k==='creeks'){if(on('creeks')){creekGroup.addTo(map);creekLabels.addTo(map);loadWaters();loadCreeks();refreshFlows();}else{map.removeLayer(creekGroup);map.removeLayer(creekLabels);map.removeLayer(flowGroup);}}
  if(k==='features')loadFeats();}
function v4Move(){const z=map.getZoom();
  if(on('creeks')&&z<12)map.removeLayer(creekGroup);else if(on('creeks'))creekGroup.addTo(map);
  if(on('water')&&z<11)map.removeLayer(waterGroup);else if(on('water'))waterGroup.addTo(map);
  if(on('contours')&&z<13)map.removeLayer(contGroup);else if(on('contours'))contGroup.addTo(map);
  evict();loadWaters();loadENC();loadSoundings();loadContours().then(refreshContourLabels);loadCreeks();loadFeats();refreshFlows();refreshCreekLabels();refreshContourLabels();remarkAll();}

function polyRings(geom){return geom.type==='Polygon'?[geom.coordinates]:geom.type==='MultiPolygon'?geom.coordinates:[];}

// ---- 1) WDFW emergency rules (official RSS, mirrored to JSON by a GitHub Action because the feed has no CORS) ----
let emerg=null,emergP=null;
function loadEmerg(){if(emergP)return emergP;emergP=fetch('data/emergency-rules.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
  .then(d=>{const t=todayISO();const byW=new Map();
    d.items.forEach((it,i)=>{it.i=i;it.st=!it.start&&!it.end?(it.openEnded?'active':'unclear'):it.start&&it.start>t?'upcoming':it.end&&it.end<t?'ended':'active';
      it.keys=it.waters.map(w=>({k:normW(w.name),county:w.county}));for(const w of it.keys){const p=byW.get(w.k);if(!p||p.published<it.published)byW.set(w.k,it);}});
    d.items.forEach(it=>it.newer=it.keys.some(w=>byW.get(w.k)!==it));emerg=d;ruleState.checked=d.checkedAt;return d;})
  .catch(e=>{emergP=null;status('WDFW emergency rules list unavailable. Check wdfw.wa.gov.');return null;});return emergP;}
function normW(n){return String(n||'').toLowerCase().replace(/\(.*?\)/g,' ').replace(/\blk\b\.?/g,'lake').replace(/['’]/g,'').replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();}
const cty=new Map();
async function countyAt(ll){const k=ll[0].toFixed(2)+','+ll[1].toFixed(2);if(cty.has(k))return cty.get(k);
  const p=getJSON(`https://tigerweb.geo.census.gov/arcgis/rest/services/TIGERweb/State_County/MapServer/1/query?geometry=${ll[1]},${ll[0]}&geometryType=esriGeometryPoint&inSR=4326&outFields=NAME,STATE&returnGeometry=false&f=json`,{},8000)
    .then(j=>{const a=j.features?.[0]?.attributes;return a?{county:String(a.NAME).replace(/ County$/,''),wa:a.STATE==='53'}:null;}).catch(()=>{cty.delete(k);return null;});cty.set(k,p);return p;}
function emergByName(name,county){if(!emerg||!name)return[];const nn=normW(name);if(!nn||nn.split(' ').length<2)return[];const out=[];
  for(const it of emerg.items){if(it.st==='ended'&&it.end<new Date(Date.now()-7*864e5).toLocaleDateString('en-CA'))continue;
    for(const w of it.keys){if(w.k!==nn)continue;let level='name';if(w.county){if(county==null)level='name';else if(county.toLowerCase()===w.county.toLowerCase())level='match';else{level=null;}}

// ---- 6) 400 ft below dams (pamphlet statewide general rule + WAC 220-310-030(1)) ----

    for(const l of c.lines){const P=proj(d.ll[0]);for(let i=0;i<l.length-1;i++){const a=P.f(l[i][1],l[i][0]),b=P.f(l[i+1][1],l[i+1][0]),p=P.f(d.ll[0],d.ll[1]);
        const dx=b[0]-a[0],dy=b[1]-a[1];const t=Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/(dx*dx+dy*dy||1)));const q=[a[0]+t*dx,a[1]+t*dy];const dd=Math.hypot(q[0]-p[0],q[1]-p[1]);
        if(d.stream&&/^\s*tr\b/i.test(d.stream)&&c.name&&nameHit(c.name,d.stream.replace(/^\s*tr\W*/i,'')))continue;const sc=dd-(nameHit(c.name,d.stream)?150:0)+(c.ap?40:0);if(dd<(nameHit(c.name,d.stream)?250:70)&&(!best||sc<best.sc))best={dd,sc,c,l,i,t,P};}}}
  if(!best)return null;const {P}=best;let l=best.l,i=best.i;const a=P.f(l[i][1],l[i][0]),b=P.f(l[i+1][1],l[i+1][0]);let cur=[a[0]+best.t*(b[0]-a[0]),a[1]+best.t*(b[1]-a[1])];

      for(const c of creeks.values()){if(c.flowdir!==1)continue;for(const l2 of c.lines){if(l2!==l&&hav([end[1],end[0]],[l2[0][1],l2[0][0]])<3){nx=l2;break;}}if(nx)break;}
      if(!nx)break;l=nx;i=1;continue;}

const nidCells=new Map();

  parts.push(`<p class="sub" style="font-size:10.5px">Sources: WDFW emergency rules feed${ruleState.checked?` (checked ${new Date(ruleState.checked).toLocaleString(undefined,{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})})`:''}; 2026–27 WA Sport Fishing Rules; WDFW GIS (marine areas, MPAs); US Census, NPS, USFWS boundaries; dams from USACE National Inventory of Dams, USGS NHD and OSM. <a target="_blank" rel="noopener" href="${RL.pamphlet}">Full pamphlet</a></p>`);
  return parts.join('');}
async function openRules(o){openSheet(`<h3>Rules &amp; closures</h3><div class="sub">${esc(o.ruleName||o.name||'This spot')}</div><div id="rulesBody"><p class="sub">Checking WDFW rules…</p></div>`,'rules');
  const r=await rulesAt(o);if(!$('#rulesBody'))return;$('#rulesBody').innerHTML=rulesHTML(r,o);}
async function rulesStrip(o){const el=$('#rstrip');if(!el)return;const tok=o;el.innerHTML='<span>Rules &amp; closures</span><b>›</b>';el.className='rstrip';el.onclick=()=>openRules(o);
  if(!on('rules'))return;const r=await rulesAt(o);if(ctx!==tok||!$('#rstrip'))return;const sv=sevOf(r);
  const act=r.em.filter(x=>x.it.st==='active'||x.it.st==='unclear');const top=act[0]||r.em[0];

  if(r.inMPA.some(m=>m.lvl==='closed'))t='⛔ No-take marine preserve: '+r.inMPA[0].name;else if(r.dams.length)t='⛔ No fishing 400 ft below the dam';

  else if(r.inMPA.length)t='⚠ Marine protected area: '+r.inMPA[0].name;else if(r.land.length)t='⚠ '+landInfo(r.land[0]).t;else if(r.ma)t=`Marine Area ${r.ma.num} · ${r.ma.name}: rules`;

async function geocode(q){
  try{const r=await getJSON(`https://nominatim.openstreetmap.org/search?format=jsonv2&limit=6&q=${encodeURIComponent(q)}&viewbox=${map.getBounds().pad(3).toBBoxString()}`,{headers:{'Accept-Language':'en'}},9000);
    if(r.length)return r.map(x=>({name:x.display_name,lat:+x.lat,lng:+x.lon,bb:x.boundingbox&&[[+x.boundingbox[0],+x.boundingbox[2]],[+x.boundingbox[1],+x.boundingbox[3]]]}));}catch(e){}
  const c=map.getCenter();const p=await getJSON(`https://photon.komoot.io/api/?limit=6&lat=${c.lat}&lon=${c.lng}&q=${encodeURIComponent(q)}`,{},9000);
  return(p.features||[]).map(f=>{const r=f.properties,x=r.extent;return{name:[r.name,r.city,r.county,r.state].filter(Boolean).join(', '),lat:f.geometry.coordinates[1],lng:f.geometry.coordinates[0],bb:x&&[[x[3],x[0]],[x[1],x[2]]]};});
}

function go(r){$('#results').style.display='none';$('#search').blur();if(r.bb)map.fitBounds(r.bb,{maxZoom:15,padding:[20,20]});else map.setView([r.lat,r.lng],14);}
$('#search').addEventListener('keydown',async e=>{if(e.key!=='Enter')return;e.preventDefault();const q=e.target.value.trim();if(!q)return;
  const ll=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(ll)return go({lat:+ll[1],lng:+ll[2]});
  const box=$('#results');box.style.display='block';box.innerHTML='<div style="color:#6b7785">Searching…</div>';
  try{res=await geocode(q);if(!res.length){box.innerHTML='<div style="color:#6b7785">No results</div>';return;}if(res.length===1)return go(res[0]);
    box.innerHTML=res.map((r,i)=>`<div data-i="${i}" role="button" tabindex="0">${esc(r.name)}</div>`).join('');}catch(err){box.innerHTML='<div style="color:#6b7785">Search failed</div>';}});
$('#results').onclick=e=>{const d=e.target.closest('[data-i]');if(d)go(res[+d.dataset.i]);};
